<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page.title.perfil">El meu perfil — Cercador Graus FP</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display:ital@0;1&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --dark: #1c1410;
      --warm: #8a7060;
      --warm2: #f5ece2;
      --border: #e8ddd4;
      --bg: #fdf8f2;
      --white: #ffffff;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      color: var(--dark);
      background: var(--bg);
    }

    /* ── Topbar ── */
    .topbar {
      background: var(--dark);
      padding: 0 48px;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      height: 52px;
    }

    .topbar-logo {
      font-family: 'DM Serif Display', serif;
      color: var(--white);
      font-size: 20px;
      letter-spacing: -0.3px;
      text-decoration: none;
    }

    #auth-widget {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .auth-greeting {
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
    }

    .auth-btn {
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--white);
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      transition: background 0.15s;
    }

    .auth-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .auth-btn--primary {
      background: var(--white);
      color: var(--dark);
      border-color: var(--white);
    }

    .auth-btn--primary:hover {
      background: var(--warm2);
    }

    /* ── Hero ── */
    .hero {
      border-bottom: 2px solid var(--dark);
      padding: 40px 48px 32px;
    }

    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 48px;
      font-weight: 400;
      line-height: 1.05;
      color: var(--dark);
      margin-bottom: 10px;
    }

    .hero-sub {
      font-size: 15px;
      color: var(--warm);
    }

    /* ── Section nav (tabs) ── */
    .section-nav {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--border);
      padding: 0 48px;
      background: var(--white);
    }

    .section-nav-link {
      font-size: 13px;
      font-weight: 600;
      padding: 12px 20px;
      color: var(--warm);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s;
    }

    .section-nav-link:hover {
      color: var(--dark);
    }

    .section-nav-link.active {
      color: var(--dark);
      border-bottom-color: var(--dark);
    }

    /* ── Content ── */
    .content {
      padding: 28px 48px 64px;
    }

    /* ── Favorits section ── */
    .favs-summary {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .favs-count {
      font-family: 'DM Serif Display', serif;
      font-size: 36px;
      color: var(--dark);
      line-height: 1;
    }

    .favs-label {
      font-size: 13px;
      color: var(--warm);
    }

    .results-table th.col-centres,
    .results-table td.col-centres {
      width: auto;
      width: 35%;
    }

    .btn-fav-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: #e53935;
      padding: 2px 6px 2px 0;
      vertical-align: middle;
      line-height: 1;
    }

    .btn-fav-remove:hover {
      opacity: 0.7;
    }

    .badge-old {
      display: inline-block;
      margin-left: 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--warm);
      background: var(--warm2);
      border-radius: 3px;
      padding: 2px 6px;
      vertical-align: middle;
    }

    .fav-denom-link {
      color: var(--dark);
      text-decoration: none;
    }

    .fav-denom-link:hover {
      text-decoration: underline;
    }

    .centres-chips {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
    }

    .centre-chip {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      font-size: 12px;
      background: var(--warm2);
      color: var(--dark);
      padding: 3px 8px;
      border-radius: 3px;
      border: 1px solid var(--border);
    }

    .centre-chip--inactiu {
      background: transparent;
      border-style: dashed;
      color: var(--warm);
      opacity: 0.8;
    }

    .centre-inactiu-tag {
      font-size: 10px;
      font-style: italic;
      color: var(--warm);
    }

    .centre-chip-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--warm);
      font-size: 12px;
      line-height: 1;
      padding: 0;
    }

    .centre-chip-remove:hover {
      color: #991b1b;
    }

    .centres-manage-link {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--dark);
      text-decoration: none;
    }

    .centres-manage-link:hover {
      text-decoration: underline;
    }

    .centres-none {
      color: var(--warm);
      font-size: 12px;
    }

    /* ── Tables (favorits, alertes i seguiment) ── */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .results-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 14px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    /* Denominació: estreta i amb salt de línia — el nom del grau pot ocupar
       vàries línies sense problema. Centres: la columna més important de
       la vista de favorits, se li dona molt més espai. */
    /* Grau, Nivell i Codi: contingut curt i fix — píxels, no %, perquè no
       creixin en pantalles amples (amb table-layout:fixed un % es calcula
       sobre l'amplada total de la taula, que aquí no té límit màxim). */
    .results-table th.col-grau,
    .results-table td.col-grau {
      width: 40px;
    }

    .results-table th.col-niv,
    .results-table td.col-niv {
      width: 48px;
    }

    .results-table th.col-codi,
    .results-table td.col-codi {
      width: 80px;
    }

    /* Denominació i Família: contingut variable — es reparteixen l'espai
       restant en %, junt amb Centres. */
    .results-table th.col-nom,
    .results-table td.col-nom {
      width: 30%;
      white-space: normal;
      word-break: break-word;
    }

    .results-table th.col-fam,
    .results-table td.col-fam {
      width: 18%;
    }

    .results-table thead tr {
      background: var(--warm2);
      border-bottom: 2px solid var(--dark);
    }

    .results-table th {
      text-align: left;
      padding: 11px 16px;
      font-weight: 600;
      color: var(--dark);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .results-table th.col-created,
    .results-table th.col-sent {
      width: 140px;
    }

    .results-table th.col-active {
      width: 100px;
    }

    .results-table th.col-actions {
      width: 48px;
    }

    .results-table th.col-prov {
      width: 160px;
    }

    .results-table td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .results-table tbody tr:hover td {
      background: var(--warm2);
    }

    .results-table tbody tr:last-child td {
      border-bottom: none;
    }

    .results-table td.col-created,
    .results-table td.col-sent,
    .results-table td.col-prov {
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      color: var(--warm);
      white-space: nowrap;
    }

    .toggle-btn {
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      border: none;
    }

    .toggle-btn--active {
      background: #dcfce7;
      color: #166534;
    }

    .toggle-btn--inactive {
      background: var(--warm2);
      color: var(--warm);
    }

    .toggle-btn:hover {
      filter: brightness(0.92);
    }

    .toggle-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--warm);
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .delete-btn:hover {
      color: #991b1b;
      background: #fee2e2;
    }

    .delete-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* ── States ── */
    .empty-state {
      text-align: center;
      color: var(--warm);
      padding: 48px 0;
    }

    .empty-state a {
      color: var(--dark);
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 48px 0;
      color: var(--warm);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinner {
      border: 3px solid var(--border);
      border-top-color: var(--dark);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 20px 48px;
      text-align: right;
    }

    footer a {
      font-size: 13px;
      color: var(--warm);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--dark);
    }

    /* ── Lang selector ── */
    .lang-selector {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 16px;
    }

    .lang-btn {
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.04em;
      transition: background 0.15s, color 0.15s;
    }

    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--white);
    }

    .lang-btn--active {
      background: rgba(255, 255, 255, 0.18);
      color: var(--white);
      border-color: rgba(255, 255, 255, 0.6);
    }

    @media (max-width: 768px) {
      .topbar {
        padding: 0 16px;
      }

      .hero {
        padding: 24px 16px 20px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .section-nav {
        padding: 0 16px;
      }

      .content {
        padding: 16px 16px 32px;
      }

      footer {
        padding: 20px 16px;
      }

      .results-table {
        font-size: 13px;
      }
    }
  </style>
  <script src="i18n.js"></script>
  <script src="auth.js"></script>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="topbar-logo">GrausFP</a>
      <div id="auth-widget"></div>
      <div class="lang-selector" aria-label="Language selector">
        <button class="lang-btn" data-lang="ca" onclick="setLang('ca')">CA</button>
        <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
      </div>
    </div>
  </header>

  <div class="hero">
    <h1><span data-i18n="perfil.hero.h1">El meu</span><br><em data-i18n="perfil.hero.h1.em">perfil</em></h1>
    <p class="hero-sub" data-i18n="perfil.hero.sub">Favorits, alertes i seguiment de centres en un sol lloc</p>
  </div>

  <nav class="section-nav" aria-label="Seccions del perfil">
    <a href="#favorits" class="section-nav-link active" id="tab-favorits" data-i18n="perfil.nav.favorits">Favorits</a>
    <a href="#alertes" class="section-nav-link" id="tab-alertes" data-i18n="perfil.nav.alertes">Alertes</a>
    <a href="#seguiment" class="section-nav-link" id="tab-seguiment" data-i18n="perfil.nav.seguiment">Seguiment de centres (novetats)</a>
    <a href="#fpo" class="section-nav-link" id="tab-fpo" data-i18n="perfil.nav.fpo">Especialitats FPO</a>
  </nav>

  <main class="content">
    <div id="section-favorits">
      <div class="loading-state">
        <div class="spinner"></div>
      </div>
    </div>
    <div id="section-alertes" hidden>
      <div class="loading-state">
        <div class="spinner"></div>
      </div>
    </div>
    <div id="section-seguiment" hidden>
      <div class="loading-state">
        <div class="spinner"></div>
      </div>
    </div>
    <div id="section-fpo" hidden>
      <div class="loading-state">
        <div class="spinner"></div>
      </div>
    </div>
  </main>

  <footer>
    <a href="index.html" data-i18n="perfil.footer.back">← Tornar al cercador</a>
  </footer>

  <script>
    (function () {
      var API_BASE = window.location.hostname === 'localhost'
        ? 'http://localhost:5001' : '';

      var LOCALE = getLang() === 'ca' ? 'ca-ES' : 'es-ES';

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]);
        });
      }

      var fpoLang = getLang() === 'es' ? 'es' : 'ca';

      /* ── Tab switching ── */
      var tabs = ['favorits', 'alertes', 'seguiment', 'fpo'];

      function activateTab(name) {
        tabs.forEach(function (tab) {
          var link = document.getElementById('tab-' + tab);
          var section = document.getElementById('section-' + tab);
          if (tab === name) {
            link.classList.add('active');
            section.removeAttribute('hidden');
          } else {
            link.classList.remove('active');
            section.setAttribute('hidden', '');
          }
        });
      }

      tabs.forEach(function (tab) {
        document.getElementById('tab-' + tab).addEventListener('click', function (e) {
          e.preventDefault();
          activateTab(tab);
        });
      });

      /* ── Auth gate (comú a les 3 seccions) ── */
      async function checkAuth() {
        var res = await fetch(API_BASE + '/api/auth/me', { credentials: 'include' });
        if (!res.ok) return null;
        return res.json();
      }

      /* ── Secció Favorits ── */
      function fichaHref(row) {
        // Tots els graus C (pla antic i LOMLOE) despleguen el panell de detall
        // dins el cercador (Pla 058) — enllacem a la seva fila al llistat general.
        if (row.grado === 'C') return 'index.html?oferta=' + row.oferta_id;
        if (['A', 'B', 'C'].includes(row.grado) && row.ficha_id) {
          return API_BASE + '/api/ficha-redirect?grado=' + row.grado + '&codigo=' + encodeURIComponent(row.codigo);
        }
        if (['D', 'E'].includes(row.grado) && row.ficha_url) return row.ficha_url;
        return null;
      }

      function centresClau(row) {
        return row.grado === 'C' && row.plan_antiguo ? row.codigo : String(row.oferta_id ?? row.id);
      }

      async function loadFavorits() {
        var section = document.getElementById('section-favorits');
        try {
          var favRes = await fetch(API_BASE + '/api/favorites', { credentials: 'include' });
          if (favRes.status === 401) {
            section.innerHTML = '<p class="empty-state">' + t('perfil.login.required') + '</p>';
            return;
          }
          var favs = await favRes.json();
          if (!favs.length) {
            section.innerHTML = '<p class="empty-state">' + t('perfil.favs.empty') + '</p>';
            return;
          }

          var ofertesRes = await fetch(API_BASE + '/api/ofertes');
          var ofertes = ofertesRes.ok ? await ofertesRes.json() : [];
          var byId = {};
          ofertes.forEach(function (r) { byId[r.id] = r; });

          var countRes = await fetch(API_BASE + '/api/centres/count');
          var centresCount = countRes.ok ? await countRes.json() : {};

          var rows = favs
            .map(function (f) {
              var oferta = byId[f.oferta_id];
              if (!oferta) return null;
              return Object.assign({}, oferta, { oferta_id: f.oferta_id, centreIds: f.centres || [] });
            })
            .filter(Boolean);

          // Carrega els noms dels centres seleccionats per a cada favorit.
          // Un centre seleccionat que ja no imparteix aquest grau es manté
          // igualment (consultant el catàleg complet) amb actiu=false, en
          // lloc de desaparèixer de la llista sense explicació.
          await Promise.all(rows.map(async function (row) {
            if (!row.centreIds.length) { row.centres = []; return; }
            try {
              var clau = centresClau(row);
              var param = (row.grado === 'C' && row.plan_antiguo) ? 'codigo=' : 'id=';
              var cRes = await fetch(API_BASE + '/api/centres?' + param + encodeURIComponent(clau));
              var all = cRes.ok ? await cRes.json() : [];
              var activeIds = {};
              all.forEach(function (c) { activeIds[c.id] = true; });
              var actius = all
                .filter(function (c) { return row.centreIds.includes(c.id); })
                .map(function (c) { return Object.assign({}, c, { actiu: true }); });
              var idsInactius = row.centreIds.filter(function (id) { return !activeIds[id]; });
              var inactius = [];
              if (idsInactius.length) {
                try {
                  var infoRes = await fetch(API_BASE + '/api/centres/info?ids=' +
                    idsInactius.map(encodeURIComponent).join(','));
                  var infoAll = infoRes.ok ? await infoRes.json() : [];
                  inactius = infoAll.map(function (c) { return Object.assign({}, c, { actiu: false }); });
                } catch (e) { /* si falla, simplement no es mostren els inactius */ }
              }
              row.centres = actius.concat(inactius);
            } catch (e) {
              row.centres = [];
            }
          }));

          var trs = rows.map(function (row) {
            var href = fichaHref(row);
            var denomInner = href
              ? '<a class="fav-denom-link" href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(row.denominacion) + '</a>'
              : esc(row.denominacion);
            var oldBadge = row.plan_antiguo ? '<span class="badge-old">' + t('index.badge.old') + '</span>' : '';

            var totalCentres = centresCount[centresClau(row)] || 0;
            var centresHtml;
            if (row.centres.length) {
              var chips = row.centres.map(function (c) {
                var inactiveTag = c.actiu === false
                  ? ' <span class="centre-inactiu-tag">' + t('perfil.favs.centres.inactive') + '</span>'
                  : '';
                var contactBits = [];
                if (c.telefon) contactBits.push('📞 <a href="tel:' + esc(c.telefon) + '" style="color:inherit;text-decoration:none">' + esc(c.telefon) + '</a>');
                if (c.email) contactBits.push('<a href="mailto:' + esc(c.email) + '" style="color:inherit">' + esc(c.email) + '</a>');
                var contactLine = contactBits.length
                  ? '<div style="font-size:11px;color:var(--warm);margin-top:2px;">' + contactBits.join(' · ') + '</div>'
                  : '';
                return '<span class="centre-chip' + (c.actiu === false ? ' centre-chip--inactiu' : '') + '">' +
                  '<span>' + esc(c.nombre) +
                  (c.localitat ? ' <span style="color:var(--warm)">(' + esc(c.localitat) + ')</span>' : '') +
                  inactiveTag + contactLine + '</span>' +
                  ' <button class="centre-chip-remove" data-oferta="' + row.oferta_id + '" data-centre="' + c.id +
                  '" aria-label="' + t('index.fav.remove') + '">✕</button></span>';
              }).join('');
              centresHtml = '<div class="centres-chips">' + chips + '</div>' +
                '<a class="centres-manage-link" href="index.html?oferta=' + row.oferta_id + '">' +
                t('perfil.favs.centres.manage') + '</a>';
            } else if (totalCentres > 0) {
              centresHtml = '<div class="centres-none">' + t('perfil.favs.centres.none') + '</div>' +
                '<a class="centres-manage-link" href="index.html?oferta=' + row.oferta_id + '">' +
                t('perfil.favs.centres.manage') + '</a>';
            } else {
              centresHtml = '';
            }

            return '<tr>' +
              '<td class="col-nom">' +
              '<button class="btn-fav-remove" data-oferta="' + row.oferta_id + '" title="' + t('index.fav.remove') + '">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16">' +
              '<path fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" ' +
              'd="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />' +
              '</svg></button>' +
              denomInner + oldBadge +
              '</td>' +
              '<td class="col-codi">' + esc(row.codigo ?? '—') + '</td>' +
              '<td class="col-fam">' + esc(row.familia) + '</td>' +
              '<td class="col-grau">' + esc(row.grado) + '</td>' +
              '<td class="col-niv">' + esc(row.nivel ?? '—') + '</td>' +
              '<td class="col-centres">' + centresHtml + '</td>' +
              '</tr>';
          }).join('');

          section.innerHTML =
            '<div class="favs-summary">' +
            '<span class="favs-count">' + rows.length + '</span>' +
            '<span class="favs-label">' + t('perfil.favs.title') + '</span>' +
            '</div>' +
            '<div class="table-wrap"><table class="results-table"><thead><tr>' +
            '<th class="col-nom">' + t('index.col.nom') + '</th>' +
            '<th class="col-codi">' + t('index.col.codi') + '</th>' +
            '<th class="col-fam">' + t('index.col.fam') + '</th>' +
            '<th class="col-grau">' + t('index.col.grau') + '</th>' +
            '<th class="col-niv">' + t('index.col.niv') + '</th>' +
            '<th class="col-centres">' + t('perfil.favs.centres.title') + '</th>' +
            '</tr></thead><tbody>' + trs + '</tbody></table></div>';

          section.querySelectorAll('.btn-fav-remove').forEach(function (btn) {
            btn.addEventListener('click', async function () {
              var ofertaId = btn.dataset.oferta;
              btn.disabled = true;
              try {
                var r = await fetch(API_BASE + '/api/favorites/' + ofertaId, { method: 'DELETE', credentials: 'include' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                await loadFavorits();
              } catch (e) {
                btn.disabled = false;
              }
            });
          });

          section.querySelectorAll('.centre-chip-remove').forEach(function (btn) {
            btn.addEventListener('click', async function () {
              var ofertaId = btn.dataset.oferta;
              var centreId = btn.dataset.centre;
              btn.disabled = true;
              try {
                var r = await fetch(API_BASE + '/api/favorites/' + ofertaId + '/centres/' + centreId,
                  { method: 'DELETE', credentials: 'include' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                await loadFavorits();
              } catch (e) {
                btn.disabled = false;
              }
            });
          });
        } catch (e) {
          section.innerHTML = '<p class="empty-state" style="color:#991b1b;">' + t('perfil.error') + '</p>';
        }
      }

      /* ── Secció Especialitats FPO ── */
      function fpoEstatBadge(estat) {
        var colors = {
          inscripcio: 'background:#dcfce7;color:#166534;',
          informacio: 'background:var(--warm2);color:var(--warm);',
          gestio: 'background:#f1f1f1;color:#555;'
        };
        return '<span style="display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;' +
          (colors[estat] || colors.informacio) + '">' + esc(t('fpo.estat.' + estat)) + '</span>';
      }

      function fpoCursCard(codi, c) {
        var fin = c.finalitzat === true;
        var centre = c.centre || {};
        var lines = [];
        if (fin) {
          lines.push('<span style="color:var(--warm);font-style:italic;">' + t('perfil.fpo.curs_finalitzat') + '</span>');
          if (c.centre_id) lines.push('<span style="color:var(--warm);font-size:11px;">id ' + esc(c.centre_id) + '</span>');
        } else {
          lines.push('<strong>' + esc(centre.nom || '') + '</strong>');
          var loc = [centre.municipi, centre.comarca ? '(' + centre.comarca + ')' : ''].filter(Boolean).join(' ');
          if (loc) lines.push('<span style="color:var(--warm);font-size:11px;">' + esc(loc) + '</span>');
          if (c.dataInici || c.dataFi) lines.push('<span style="font-size:11px;">' + esc((c.dataInici || '?') + ' – ' + (c.dataFi || '?')) + '</span>');
          lines.push(fpoEstatBadge(c.estat));
        }
        return '<div style="border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-top:6px;font-size:13px;' +
          (fin ? 'opacity:.6;' : '') + '">' +
          '<button class="btn-fpo-curs-remove" data-codi="' + esc(codi) + '" data-curs="' + esc(c.curs_id) +
          '" title="' + t('index.fav.remove') + '" style="float:right;border:0;background:none;cursor:pointer;color:var(--warm);">✕</button>' +
          lines.join('<br>') + '</div>';
      }

      async function loadFpo() {
        var section = document.getElementById('section-fpo');
        try {
          var res = await fetch(API_BASE + '/api/fpo/favorites', { credentials: 'include' });
          if (res.status === 401) {
            section.innerHTML = '<p class="empty-state">' + t('perfil.login.required') + '</p>';
            return;
          }
          var favs = res.ok ? await res.json() : [];
          if (!favs.length) {
            section.innerHTML = '<p class="empty-state">' + t('perfil.fpo.empty') + '</p>';
            return;
          }
          var cards = favs.map(function (e) {
            var titol = (e.titol || {})[fpoLang] || e.especialitat_codi;
            var fam = (e.familia || {}).desc ? (e.familia.desc[fpoLang] || '') : '';
            var area = (e.area || {}).desc ? (e.area.desc[fpoLang] || '') : '';
            var meta = [fam, area, e.nivell ? t('fpo.col.nivell') + ' ' + e.nivell : '',
                        e.hores ? Math.round(e.hores) + ' h' : ''].filter(Boolean).join(' · ');
            var cursosHtml = '';
            if ((e.cursos || []).length) {
              cursosHtml = '<div style="margin-top:8px;font-size:12px;color:var(--warm);">' +
                t('perfil.fpo.cursos_marcats') + '</div>' +
                e.cursos.map(function (c) { return fpoCursCard(e.especialitat_codi, c); }).join('');
            }
            return '<div style="border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px;">' +
              '<button class="btn-fpo-remove" data-codi="' + esc(e.especialitat_codi) + '" title="' + t('index.fav.remove') +
              '" style="float:right;border:0;background:none;cursor:pointer;color:var(--warm);font-size:16px;">✕</button>' +
              '<div style="font-weight:600;">' + esc(titol) +
              ' <span class="badge-old" style="font-weight:400;">' + esc(e.especialitat_codi) + '</span></div>' +
              '<div style="font-size:12px;color:var(--warm);margin-top:2px;">' + esc(meta) + '</div>' +
              cursosHtml + '</div>';
          }).join('');

          section.innerHTML =
            '<div class="favs-summary"><span class="favs-count">' + favs.length + '</span>' +
            '<span class="favs-label">' + t('perfil.nav.fpo') + '</span></div>' + cards;

          section.querySelectorAll('.btn-fpo-remove').forEach(function (btn) {
            btn.addEventListener('click', async function () {
              btn.disabled = true;
              try {
                var r = await fetch(API_BASE + '/api/fpo/favorites/' + encodeURIComponent(btn.dataset.codi),
                  { method: 'DELETE', credentials: 'include' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                await loadFpo();
              } catch (e) { btn.disabled = false; }
            });
          });
          section.querySelectorAll('.btn-fpo-curs-remove').forEach(function (btn) {
            btn.addEventListener('click', async function () {
              btn.disabled = true;
              try {
                var r = await fetch(API_BASE + '/api/fpo/favorites/' + encodeURIComponent(btn.dataset.codi) +
                  '/courses/' + encodeURIComponent(btn.dataset.curs), { method: 'DELETE', credentials: 'include' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                await loadFpo();
              } catch (e) { btn.disabled = false; }
            });
          });
        } catch (e) {
          section.innerHTML = '<p class="empty-state" style="color:#991b1b;">' + t('perfil.error') + '</p>';
        }
      }

      /* ── Secció Alertes ── */
      function buildAlertFilterDesc(filter) {
        var parts = [];
        if (filter.grado) parts.push('Grado ' + filter.grado);
        if (filter.familia) parts.push(filter.familia);
        if (filter.nivel != null) parts.push(t('alertes.filter.niv') + filter.nivel);
        if (filter.texto) parts.push('Texto: «' + filter.texto + '»');
        return parts.length ? parts.join(' · ') : t('alertes.filter.all');
      }

      function renderAlertes(alerts) {
        var section = document.getElementById('section-alertes');
        if (!alerts.length) {
          section.innerHTML = '<p class="empty-state">' + t('alertes.empty') + '</p>';
          return;
        }
        var rows = alerts.map(function (a) {
          var filter = JSON.parse(a.filter_json || '{}');
          var desc = buildAlertFilterDesc(filter);
          var active = a.active === 1 || a.active === true;
          var lastSent = a.last_sent_at
            ? new Date(a.last_sent_at).toLocaleDateString(LOCALE) : '—';
          var created = a.created_at
            ? new Date(a.created_at).toLocaleString(LOCALE, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })
            : '—';
          return '<tr>' +
            '<td>' + esc(desc) + '</td>' +
            '<td class="col-created">' + esc(created) + '</td>' +
            '<td class="col-sent">' + esc(lastSent) + '</td>' +
            '<td class="col-active">' +
            '<button class="toggle-btn ' + (active ? 'toggle-btn--active' : 'toggle-btn--inactive') + '"' +
            ' data-id="' + a.id + '" data-active="' + (active ? '1' : '0') + '">' +
            (active ? t('alertes.state.active') : t('alertes.state.inactive')) +
            '</button>' +
            '</td>' +
            '<td class="col-actions">' +
            '<button class="delete-btn" data-id="' + a.id + '" aria-label="' + t('alertes.aria.delete') + '">✕</button>' +
            '</td>' +
            '</tr>';
        }).join('');

        section.innerHTML =
          '<table class="results-table"><thead><tr>' +
          '<th>' + t('alertes.col.filter') + '</th>' +
          '<th class="col-created">' + t('alertes.col.created') + '</th>' +
          '<th class="col-sent">' + t('alertes.col.sent') + '</th>' +
          '<th class="col-active">' + t('alertes.col.state') + '</th>' +
          '<th class="col-actions"></th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table>';

        section.querySelectorAll('.toggle-btn').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            var id = parseInt(btn.dataset.id);
            var currentActive = btn.dataset.active === '1';
            btn.disabled = true;
            try {
              var r = await fetch(API_BASE + '/api/alerts/' + id, {
                method: 'PATCH', credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ active: !currentActive })
              });
              if (!r.ok) throw new Error('HTTP ' + r.status);
              await loadAlertes();
            } catch (e) {
              console.error('toggle alerta failed:', e);
              btn.disabled = false;
              alert(t('alertes.err.toggle'));
            }
          });
        });

        section.querySelectorAll('.delete-btn').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            if (!confirm(t('alertes.confirm.delete'))) return;
            var id = parseInt(btn.dataset.id);
            btn.disabled = true;
            try {
              var r = await fetch(API_BASE + '/api/alerts/' + id, { method: 'DELETE', credentials: 'include' });
              if (!r.ok) throw new Error('HTTP ' + r.status);
              await loadAlertes();
            } catch (e) {
              console.error('delete alerta failed:', e);
              btn.disabled = false;
              alert(t('alertes.err.delete'));
            }
          });
        });
      }

      async function loadAlertes() {
        var section = document.getElementById('section-alertes');
        section.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';
        try {
          var res = await fetch(API_BASE + '/api/alerts', { credentials: 'include' });
          if (res.status === 401) {
            section.innerHTML = '<p class="empty-state">' + t('alertes.login.required') + '</p>';
            return;
          }
          if (!res.ok) throw new Error('HTTP ' + res.status);
          renderAlertes(await res.json());
        } catch (e) {
          section.innerHTML = '<p class="empty-state" style="color:#991b1b;">' + t('alertes.error') + '</p>';
        }
      }

      /* ── Secció Seguiment ── */
      function renderSeguiment(watches) {
        var section = document.getElementById('section-seguiment');
        if (!watches.length) {
          section.innerHTML = '<p class="empty-state">' + t('seguiment.empty') + '</p>';
          return;
        }
        var rows = watches.map(function (w) {
          var active = w.active === 1 || w.active === true;
          var prov = w.provincia_filter
            ? esc(w.provincia_filter)
            : '<span style="color:var(--warm)">' + t('seguiment.all.prov') + '</span>';
          var created = w.created_at ? w.created_at.slice(0, 10) : '—';
          var lastSent = w.last_sent_at ? w.last_sent_at.slice(0, 10) : '—';
          var newCountNote = (w.last_new_count && w.last_new_count > 0)
            ? '<br><span style="font-size:11px;color:var(--warm)">' +
              t('seguiment.newCentres', { n: w.last_new_count }) + '</span>'
            : '';
          return '<tr id="watch-pf-' + w.id + '">' +
            '<td>' + esc(w.oferta_denom) + '</td>' +
            '<td class="col-prov">' + prov + '</td>' +
            '<td class="col-created">' + created + '</td>' +
            '<td class="col-sent">' + lastSent + newCountNote + '</td>' +
            '<td class="col-active">' +
            '<button class="toggle-btn ' + (active ? 'toggle-btn--active' : 'toggle-btn--inactive') + '"' +
            ' data-id="' + w.id + '" data-active="' + (active ? '1' : '0') + '">' +
            (active ? t('seguiment.state.active') : t('seguiment.state.inactive')) +
            '</button>' +
            '</td>' +
            '<td class="col-actions">' +
            '<button class="delete-btn" data-id="' + w.id + '" title="Elimina">✕</button>' +
            '</td>' +
            '</tr>';
        }).join('');

        section.innerHTML =
          '<div class="table-wrap" style="overflow-x:auto">' +
          '<table class="results-table" style="min-width:560px"><thead><tr>' +
          '<th>' + t('seguiment.col.ens') + '</th>' +
          '<th class="col-prov">' + t('seguiment.col.prov') + '</th>' +
          '<th class="col-created">' + t('seguiment.col.created') + '</th>' +
          '<th class="col-sent">' + t('seguiment.col.sent') + '</th>' +
          '<th class="col-active">' + t('seguiment.col.state') + '</th>' +
          '<th class="col-actions"></th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table></div>';

        section.querySelectorAll('.toggle-btn').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            var id = parseInt(btn.dataset.id);
            var currentActive = btn.dataset.active === '1';
            btn.disabled = true;
            try {
              var r = await fetch(API_BASE + '/api/centres-watch/' + id, {
                method: 'PATCH', credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ active: !currentActive })
              });
              if (!r.ok) throw new Error('HTTP ' + r.status);
              await loadSeguiment();
            } catch (e) {
              console.error('toggle seguiment failed:', e);
              btn.disabled = false;
              alert(t('seguiment.err.toggle'));
            }
          });
        });

        section.querySelectorAll('.delete-btn').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            var id = parseInt(btn.dataset.id);
            btn.disabled = true;
            try {
              var r = await fetch(API_BASE + '/api/centres-watch/' + id, { method: 'DELETE', credentials: 'include' });
              if (!r.ok) throw new Error('HTTP ' + r.status);
              await loadSeguiment();
            } catch (e) {
              console.error('delete seguiment failed:', e);
              btn.disabled = false;
              alert(t('seguiment.err.delete'));
            }
          });
        });
      }

      async function loadSeguiment() {
        var section = document.getElementById('section-seguiment');
        section.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';
        try {
          var res = await fetch(API_BASE + '/api/centres-watch', { credentials: 'include' });
          if (res.status === 401) {
            section.innerHTML = '<p class="empty-state">' + t('perfil.login.required') + '</p>';
            return;
          }
          if (!res.ok) throw new Error('HTTP ' + res.status);
          renderSeguiment(await res.json());
        } catch (e) {
          section.innerHTML = '<p class="empty-state" style="color:#991b1b;">' + t('perfil.error') + '</p>';
        }
      }

      /* ── Inicialització ── */
      document.addEventListener('DOMContentLoaded', async function () {
        var user = await checkAuth();
        if (!user) {
          ['favorits', 'alertes', 'seguiment', 'fpo'].forEach(function (s) {
            document.getElementById('section-' + s).innerHTML =
              '<p class="empty-state">' + t('perfil.login.required') + '</p>';
            document.getElementById('section-' + s).removeAttribute('hidden');
          });
          document.querySelectorAll('.section-nav-link').forEach(function (l) { l.style.display = 'none'; });
          return;
        }
        await Promise.all([loadFavorits(), loadAlertes(), loadSeguiment(), loadFpo()]);
      });
    })();
  </script>
</body>

</html>
