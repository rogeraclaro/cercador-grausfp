<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page.title.ocupacions">Cerca per ocupació — Cercador Graus FP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display:ital@0;1&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dark: #1c1410; --warm: #8a7060; --warm2: #f5ece2;
      --border: #e8ddd4; --bg: #fdf8f2; --white: #ffffff;
    }
    body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; color: var(--dark); background: var(--bg); }

    .topbar { background: var(--dark); padding: 0 48px; }
    .topbar-inner { display: flex; align-items: center; height: 52px; }
    .topbar-logo { font-family: 'DM Serif Display', serif; color: var(--white); font-size: 20px; letter-spacing: -0.3px; text-decoration: none; }
    #auth-widget { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .auth-greeting { color: rgba(255,255,255,0.75); font-size: 13px; }
    .auth-btn { font-size: 13px; padding: 5px 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.35); color: var(--white); background: transparent; cursor: pointer; text-decoration: none; font-family: inherit; transition: background 0.15s; }
    .auth-btn:hover { background: rgba(255,255,255,0.12); }
    .auth-btn--primary { background: var(--white); color: var(--dark); border-color: var(--white); }
    .auth-btn--primary:hover { background: var(--warm2); }

    /* Lang selector */
    .lang-selector { display: flex; align-items: center; gap: 2px; margin-left: 16px; }
    .lang-btn {
      font-size: 11px; font-weight: 700; font-family: inherit;
      padding: 3px 8px; border-radius: 3px; cursor: pointer;
      background: transparent; border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.6); letter-spacing: 0.04em;
      transition: background 0.15s, color 0.15s;
    }
    .lang-btn:hover { background: rgba(255,255,255,0.12); color: var(--white); }
    .lang-btn--active { background: rgba(255,255,255,0.18); color: var(--white); border-color: rgba(255,255,255,0.6); }

    .hero { border-bottom: 2px solid var(--dark); padding: 40px 48px 32px; }
    .hero h1 { font-family: 'DM Serif Display', serif; font-size: 48px; font-weight: 400; line-height: 1.05; color: var(--dark); margin-bottom: 10px; }
    .hero-sub { font-size: 15px; color: var(--warm); }

    .content { padding: 28px 48px 64px; }

    #q {
      width: 100%; font-size: 18px; padding: 14px 16px;
      border: 2px solid var(--dark); border-radius: 8px;
      font-family: inherit; background: var(--white);
      margin-bottom: 16px; color: var(--dark);
    }
    #q:focus { outline: none; border-color: var(--warm); }

    .meta { color: var(--warm); font-size: 13px; margin-bottom: 16px; min-height: 20px; }

    .card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px; margin-bottom: 12px;
    }
    .card h3 { font-size: 16px; margin-bottom: 2px; }
    .card h3 a { color: var(--dark); text-decoration: none; }
    .card h3 a:hover { color: var(--warm); text-decoration: underline; }
    .card .code { font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--warm); margin-bottom: 8px; }
    .matches { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .m { font-size: 12px; padding: 3px 9px; background: #fef3c7; border-radius: 12px; }

    .empty { color: var(--warm); padding: 40px 0; text-align: center; }

    footer { border-top: 1px solid var(--border); padding: 20px 48px; text-align: right; }
    footer a { font-size: 13px; color: var(--warm); text-decoration: none; }
    footer a:hover { color: var(--dark); }

    @media (max-width: 768px) {
      .topbar { padding: 0 16px; }
      .hero { padding: 24px 16px 20px; }
      .hero h1 { font-size: 30px; }
      .content { padding: 16px 16px 32px; }
      footer { padding: 20px 16px; }
    }
  </style>
  <script src="i18n.js"></script>
  <script src="auth.js"></script>
</head>
<body>
  <nav class="topbar">
    <div class="topbar-inner">
      <a class="topbar-logo" href="index.html">Cercador FP España</a>
      <div id="auth-widget"></div>
      <div class="lang-selector" aria-label="Language selector">
        <button class="lang-btn" data-lang="ca" onclick="setLang('ca')">CA</button>
        <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
      </div>
    </div>
  </nav>

  <header class="hero">
    <h1 data-i18n="ocupacions.hero.h1">Cerca per ocupació</h1>
    <p class="hero-sub" data-i18n="ocupacions.hero.sub">Escriu què vols fer i descobreix quins graus FP hi porten.</p>
  </header>

  <main class="content">
    <input id="q" type="search" data-i18n-placeholder="ocupacions.placeholder"
           placeholder="soldador, programador, cuidador…" autofocus>
    <p class="meta" id="meta"></p>
    <div id="results"></div>
  </main>

  <footer>
    <a href="index.html" data-i18n="seguiment.footer.back">← Tornar al cercador</a>
  </footer>

  <script>
  const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:5001' : '';

  const qEl = document.getElementById('q');
  const meta = document.getElementById('meta');
  const results = document.getElementById('results');
  let timer;

  function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function fichaHref(g){
    if (g.grado === 'C' && g.codigo)
      return API_BASE + '/api/ficha-redirect?grado=C&codigo=' + encodeURIComponent(g.codigo);
    return g.ficha_url || '#';
  }

  async function go(q){
    const r = await fetch(API_BASE + '/api/ocupaciones?q=' + encodeURIComponent(q));
    const d = await r.json();
    meta.textContent = t('ocupacions.meta', { n: d.n });
    if (!d.n){ results.innerHTML = '<div class="empty">' + esc(t('ocupacions.empty')) + '</div>'; return; }
    results.innerHTML = d.resultados.map(g => `
      <div class="card">
        <a href="${esc(fichaHref(g))}" target="_blank" rel="noopener"><h3>${esc(g.denominacion)}</h3></a>
        <div class="code">${esc(g.grado)} · ${g.ocupaciones.length}</div>
        <div class="matches">${g.ocupaciones.map(m => '<span class="m">'+esc(m)+'</span>').join('')}</div>
      </div>`).join('');
  }

  qEl.addEventListener('input', e => {
    clearTimeout(timer);
    const v = e.target.value.trim();
    timer = setTimeout(() => { if (v) go(v); else { meta.textContent=''; results.innerHTML=''; } }, 200);
  });
  </script>
</body>
</html>
