<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page.title.forgot">Restablir contrasenya — Cercador Graus FP</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display:ital@0;1&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --dark: #1c1410;
      --warm: #8a7060;
      --warm2: #f5ece2;
      --border: #e8ddd4;
      --bg: #fdf8f2;
      --white: #ffffff;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      color: var(--dark);
      background: var(--bg);
      min-height: 100vh;
    }

    .topbar {
      background: var(--dark);
      padding: 0 48px;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      height: 52px;
    }

    .topbar-logo {
      font-family: 'DM Serif Display', serif;
      color: var(--white);
      font-size: 20px;
      letter-spacing: -0.3px;
      text-decoration: none;
    }

    .auth-page {
      max-width: 400px;
      margin: 64px auto;
      padding: 0 24px;
    }

    .auth-page h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 32px;
      font-weight: 400;
      color: var(--dark);
      margin-bottom: 12px;
    }

    .auth-page p.subtitle {
      font-size: 14px;
      color: var(--warm);
      margin-bottom: 28px;
    }

    .msg {
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      background: var(--warm2);
    }

    .msg--error {
      background: #fde8e8;
      border-color: #e8a0a0;
      color: #7a1515;
    }

    .msg--ok {
      background: #e8f5e8;
      border-color: #8ec98e;
      color: #1a521a;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    input[type="email"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 16px;
      font-family: inherit;
      background: var(--white);
      color: var(--dark);
    }

    input:focus {
      border-color: var(--warm);
    }

    input:focus-visible {
      outline: 2px solid var(--warm);
      outline-offset: 2px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    button[type="submit"] {
      padding: 10px;
      background: var(--dark);
      color: var(--white);
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button[type="submit"]:hover {
      opacity: 0.85;
    }

    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .auth-links {
      margin-top: 16px;
      font-size: 13px;
      color: var(--warm);
      text-align: center;
    }

    .auth-links a {
      color: var(--dark);
    }

    /* ── Lang selector ── */
    .lang-selector {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: auto;
    }

    .lang-btn {
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.04em;
      transition: background 0.15s, color 0.15s;
    }

    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--white);
    }

    .lang-btn--active {
      background: rgba(255, 255, 255, 0.18);
      color: var(--white);
      border-color: rgba(255, 255, 255, 0.6);
    }
  </style>
  <script src="i18n.js"></script>
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="topbar-logo" href="index.html">GrausFP</a>
      <div class="lang-selector" aria-label="Language selector">
        <button class="lang-btn" data-lang="ca" onclick="setLang('ca')">CA</button>
        <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
      </div>
    </div>
  </div>

  <div class="auth-page">
    <h1 data-i18n="forgot.h1">Restablir contrasenya</h1>
    <p class="subtitle" data-i18n="forgot.subtitle">Introdueix el teu email i t'enviarem un link per restablir la
      contrasenya.</p>
    <p id="msg" class="msg" role="status" hidden></p>
    <form id="form-forgot">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="el-teu@email.com">
      </div>
      <button type="submit" id="btn-submit" data-i18n="forgot.btn.submit">Envia el link</button>
    </form>
    <p class="auth-links"><a href="login.html" data-i18n="forgot.link.back">Torna a Inicia sessió</a></p>
  </div>

  <script>
    const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:5001' : '';
    const msgEl = document.getElementById('msg');
    const btn = document.getElementById('btn-submit');

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className = 'msg msg--' + type;
      msgEl.hidden = false;
    }

    document.getElementById('form-forgot').addEventListener('submit', async function (e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = t('forgot.btn.submitting');
      try {
        await fetch(API_BASE + '/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        // Sempre mostrem el mateix missatge per no revelar si l'email existeix
        showMsg(t('forgot.msg.ok'), 'ok');
        document.getElementById('form-forgot').hidden = true;
      } catch (_) {
        showMsg(t('forgot.err.network'), 'error');
        btn.disabled = false;
        btn.textContent = t('forgot.btn.submit');
      }
    });
  </script>
</body>

</html>
