<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 528">
  <style>
    /* Estils per defecte (Mode Clar i base) */
    .base-frame { fill: #ffffff; } /* El marc exterior blanc */
    .bg-inner { fill: #0056b3; transition: fill 0.3s; } /* El fons interior original (blau) */
    
    .letter { 
      fill: none; 
      stroke: #8a7060; /* El color de la G demanat */
      stroke-width: 56; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
      transition: stroke 0.3s;
    }
    .dot { fill: #8a7060; transition: fill 0.3s; } /* El color del punt demanat */

    /* Adaptació automàtica per al Mode Fosc */
    @media (prefers-color-scheme: dark) {
      .bg-inner { fill: #1a1a24; } /* Fons interior fosc */
      .letter { stroke: #ffffff; } /* La G i el punt es tornen blancs sobre fons fosc */
      .dot { fill: #ffffff; }
    }
  </style>

  <rect class="base-frame" width="528" height="528" rx="0" />

  <rect class="bg-inner" x="8" y="8" width="512" height="512" rx="0" />

  <g transform="translate(8,8)">
    <path class="letter" d="M 356 160 A 136 136 0 1 0 392 272 L 312 272" />
    <circle class="dot" cx="224" cy="272" r="28" />
  </g>
</svg>
