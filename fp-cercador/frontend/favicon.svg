<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 544">
  <style>
    /* Estils base */
    .base-frame { fill: #ffffff; }
    .bg-inner { fill: #0056b3; transition: fill 0.3s; }
    
    /* La teva tipografia específica */
    .letter { 
      fill: #8a7060; 
      font-family: 'NomDeLaTevaTipografia', sans-serif; /* <-- CANVIA AIXÒ */
      font-size: 380px; 
      font-weight: bold; 
      transition: fill 0.3s;
    }

    /* Adaptació automàtica per al Mode Fosc */
    @media (prefers-color-scheme: dark) {
      .bg-inner { fill: #1a1a24; }
      .letter { fill: #ffffff; }
    }
  </style>

  <rect class="base-frame" width="544" height="544" rx="0" />

  <rect class="bg-inner" x="16" y="16" width="512" height="512" rx="0" />

  <text class="letter" x="272" y="286" text-anchor="middle" dominant-baseline="central">G</text>
</svg>
