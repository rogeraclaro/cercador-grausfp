<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page.title.seguiment">Seguiment de centres — Cercador Graus FP</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display:ital@0;1&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --dark: #1c1410;
      --warm: #8a7060;
      --warm2: #f5ece2;
      --border: #e8ddd4;
      --bg: #fdf8f2;
      --white: #ffffff;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      color: var(--dark);
      background: var(--bg);
    }

    .topbar {
      background: var(--dark);
      padding: 0 48px;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      height: 52px;
    }

    .topbar-logo {
      font-family: 'DM Serif Display', serif;
      color: var(--white);
      font-size: 20px;
      letter-spacing: -0.3px;
      text-decoration: none;
    }

    #auth-widget {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .auth-greeting {
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
    }

    .auth-btn {
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--white);
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      transition: background 0.15s;
    }

    .auth-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .auth-btn--primary {
      background: var(--white);
      color: var(--dark);
      border-color: var(--white);
    }

    .auth-btn--primary:hover {
      background: var(--warm2);
    }

    .hero {
      border-bottom: 2px solid var(--dark);
      padding: 40px 48px 32px;
    }

    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 48px;
      font-weight: 400;
      line-height: 1.05;
      color: var(--dark);
      margin-bottom: 10px;
    }

    .hero-sub {
      font-size: 15px;
      color: var(--warm);
    }

    .content {
      padding: 28px 48px 64px;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .results-table thead tr {
      background: var(--warm2);
      border-bottom: 2px solid var(--dark);
    }

    .results-table th {
      text-align: left;
      padding: 11px 16px;
      font-weight: 600;
      color: var(--dark);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .results-table th.col-prov {
      width: 160px;
    }

    .results-table th.col-created,
    .results-table th.col-sent {
      width: 140px;
    }

    .results-table th.col-active {
      width: 100px;
    }

    .results-table th.col-actions {
      width: 48px;
    }

    .results-table td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .results-table tbody tr:hover td {
      background: var(--warm2);
    }

    .results-table tbody tr:last-child td {
      border-bottom: none;
    }

    .results-table td.col-prov,
    .results-table td.col-created,
    .results-table td.col-sent {
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      color: var(--warm);
      white-space: nowrap;
    }

    .toggle-btn {
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      border: none;
    }

    .toggle-btn--active {
      background: #dcfce7;
      color: #166534;
    }

    .toggle-btn--inactive {
      background: var(--warm2);
      color: var(--warm);
    }

    .toggle-btn:hover {
      filter: brightness(0.92);
    }

    .toggle-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--warm);
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .delete-btn:hover {
      color: #991b1b;
      background: #fee2e2;
    }

    .delete-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .empty-state {
      text-align: center;
      color: var(--warm);
      padding: 64px 48px;
    }

    .empty-state a {
      color: var(--dark);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 64px 48px;
      color: var(--warm);
    }

    .spinner {
      border: 3px solid var(--border);
      border-top-color: var(--dark);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px 48px;
      text-align: right;
    }

    footer a {
      font-size: 13px;
      color: var(--warm);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--dark);
    }

    /* ── Lang selector ── */
    .lang-selector {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 16px;
    }

    .lang-btn {
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.04em;
      transition: background 0.15s, color 0.15s;
    }

    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--white);
    }

    .lang-btn--active {
      background: rgba(255, 255, 255, 0.18);
      color: var(--white);
      border-color: rgba(255, 255, 255, 0.6);
    }

    @media (max-width: 768px) {
      .topbar {
        padding: 0 16px;
      }

      .hero {
        padding: 24px 16px 20px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .content {
        padding: 16px 16px 32px;
      }

      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .results-table {
        min-width: 560px;
      }

      footer {
        padding: 20px 16px;
      }
    }
  </style>
  <script src="i18n.js"></script>
  <script src="auth.js"></script>
</head>

<body>
  <nav class="topbar">
    <div class="topbar-inner">
      <a class="topbar-logo" href="index.html">Cercador FP España</a>
      <div id="auth-widget"></div>
      <div class="lang-selector" aria-label="Language selector">
        <button class="lang-btn" data-lang="ca" onclick="setLang('ca')">CA</button>
        <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
      </div>
    </div>
  </nav>

  <header class="hero">
    <h1 data-i18n="seguiment.hero.h1">Seguiment de centres</h1>
    <p class="hero-sub" data-i18n="seguiment.hero.sub">Rebràs un email quan apareguin nous centres que impartiran els
      ensenyaments que segueixes.</p>
  </header>

  <main class="content">
    <div class="table-wrap" id="main-content">
      <div class="loading-state">
        <div class="spinner"></div>
        <span data-i18n="seguiment.loading">Carregant seguiments…</span>
      </div>
    </div>
  </main>

  <footer>
    <a href="index.html" data-i18n="seguiment.footer.back">← Tornar al cercador</a>
    &nbsp;·&nbsp;
    <a href="alertes.html" data-i18n="seguiment.footer.alerts">Les meves alertes</a>
    &nbsp;·&nbsp;
    <a href="politica-privacitat.html" data-i18n="seguiment.footer.priv">Política de privacitat</a>
  </footer>

  <script>
    (function () {
      const API_BASE = window.location.hostname === 'localhost'
        ? 'http://localhost:5001' : '';

      function esc(s) {
        return String(s).replace(/[&<>"']/g, c =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      async function fetchWatches() {
        const res = await fetch(API_BASE + '/api/centres-watch', { credentials: 'include' });
        if (res.status === 401) {
          window.location.href = 'login.html?next=seguiment.html';
          return null;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }

      async function deleteWatch(id) {
        const res = await fetch(API_BASE + '/api/centres-watch/' + id, {
          method: 'DELETE', credentials: 'include'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
      }

      async function toggleWatch(id, active) {
        const res = await fetch(API_BASE + '/api/centres-watch/' + id, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ active })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }

      function formatDate(iso) {
        if (!iso) return '—';
        return iso.slice(0, 10);
      }

      function renderWatches(watches) {
        const main = document.getElementById('main-content');
        if (!watches.length) {
          main.innerHTML = '<p class="empty-state">' + t('seguiment.empty') + '</p>';
          return;
        }
        const rows = watches.map(w => `
        <tr id="watch-row-${w.id}">
          <td>${esc(w.oferta_denom)}</td>
          <td class="col-prov">${w.provincia_filter ? esc(w.provincia_filter) : '<span style="color:var(--warm)">' + t('seguiment.all.prov') + '</span>'}</td>
          <td class="col-created">${formatDate(w.created_at)}</td>
          <td class="col-sent">${formatDate(w.last_sent_at)}${w.last_new_count > 0
            ? '<br><span style="font-size:11px;color:var(--warm)">' + t('seguiment.newCentres', { n: w.last_new_count }) + '</span>'
            : ''}</td>
          <td class="col-active">
            <button class="toggle-btn ${w.active ? 'toggle-btn--active' : 'toggle-btn--inactive'}"
              data-id="${w.id}" data-active="${w.active ? '1' : '0'}"
              onclick="handleToggle(${w.id}, ${w.active ? 0 : 1})">
              ${w.active ? t('seguiment.state.active') : t('seguiment.state.inactive')}
            </button>
          </td>
          <td class="col-actions">
            <button class="delete-btn" title="Elimina" onclick="handleDelete(${w.id})">✕</button>
          </td>
        </tr>
      `).join('');
        main.innerHTML =
          '<table class="results-table">' +
          '<thead><tr>' +
          '<th>' + t('seguiment.col.ens') + '</th>' +
          '<th class="col-prov">' + t('seguiment.col.prov') + '</th>' +
          '<th class="col-created">' + t('seguiment.col.created') + '</th>' +
          '<th class="col-sent">' + t('seguiment.col.sent') + '</th>' +
          '<th class="col-active">' + t('seguiment.col.state') + '</th>' +
          '<th class="col-actions"></th>' +
          '</tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
          '</table>';
      }

      window.handleDelete = async function (id) {
        const row = document.getElementById('watch-row-' + id);
        const btn = row && row.querySelector('.delete-btn');
        if (btn) btn.disabled = true;
        try {
          await deleteWatch(id);
          if (row) row.remove();
          const tbody = document.querySelector('.results-table tbody');
          if (tbody && !tbody.children.length) {
            document.getElementById('main-content').innerHTML =
              '<p class="empty-state">' + t('seguiment.empty') + '</p>';
          }
        } catch (e) {
          console.error('delete seguiment failed:', e);
          if (btn) btn.disabled = false;
          alert(t('seguiment.err.delete'));
        }
      };

      window.handleToggle = async function (id, newActive) {
        const row = document.getElementById('watch-row-' + id);
        const btn = row && row.querySelector('.toggle-btn');
        if (btn) btn.disabled = true;
        try {
          const updated = await toggleWatch(id, !!newActive);
          if (btn) {
            btn.disabled = false;
            btn.className = 'toggle-btn ' + (updated.active ? 'toggle-btn--active' : 'toggle-btn--inactive');
            btn.textContent = updated.active ? t('seguiment.state.active') : t('seguiment.state.inactive');
            btn.setAttribute('onclick', `handleToggle(${id}, ${updated.active ? 0 : 1})`);
          }
        } catch (e) {
          console.error('toggle seguiment failed:', e);
          if (btn) btn.disabled = false;
          alert(t('seguiment.err.toggle'));
        }
      };

      (async () => {
        try {
          const watches = await fetchWatches();
          if (watches !== null) renderWatches(watches);
        } catch (e) {
          document.getElementById('main-content').innerHTML =
            '<p class="empty-state">' + t('seguiment.error') + '</p>';
        }
      })();
    })();
  </script>
</body>

</html>
