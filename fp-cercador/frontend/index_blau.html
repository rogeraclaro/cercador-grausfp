<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cercador Graus FP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #4A90E2;
      --dark-bg: #2C3E50;
      --light-text: #ECF0F1;
      --medium-text: #BDC3C7;
      --border-color: #34495E;
      --light-hover-bg: #3D566E;
      --attention-yellow: #F1C40F;
      --error-red: #E74C3C;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: var(--light-text);
      background: var(--dark-bg);
      line-height: 1.6;
    }

    .page-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 32px;
      background: #34495E; /* Un gris fosc lleugerament més clar que el fons del body */
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 32px;
      color: var(--light-text);
      text-align: center;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 8px;
    }

    input[type="search"],
    select {
      padding: 10px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      background: var(--light-hover-bg);
      color: var(--light-text);
      transition: all 0.2s ease-in-out;
    }

    input[type="search"] {
      flex: 1;
      min-width: 200px;
    }

    input[type="search"]:focus,
    select:focus {
      outline: none;
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.3);
      background: #3D566E;
    }

    input[type="search"]::placeholder {
      color: var(--medium-text);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      font-size: 14px;
      font-weight: 500;
      color: var(--medium-text);
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      margin-top: 16px;
    }

    .controls-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .results-table th {
      background: #3D566E; /* Un to fosc per a les capçaleres de la taula */
      text-align: left;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      color: var(--light-text);
    }

    .results-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
      color: var(--light-text);
    }

    .results-table tr:nth-child(even) td {
      background: #2C3E50; /* Fons fosc alternatiu per a les files */
    }

    .badge-old {
      display: inline-block;
      background: var(--attention-yellow);
      color: #333;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      margin-left: 8px;
      white-space: nowrap;
      vertical-align: middle;
    }

    .empty-row td {
      text-align: center;
      color: var(--medium-text);
      padding: 40px;
      font-style: italic;
      font-size: 15px;
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 60px;
      color: var(--medium-text);
      font-size: 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinner {
      border: 4px solid var(--border-color);
      border-top-color: var(--primary-blue);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.8s linear infinite;
    }

    .error-state {
      padding: 20px;
      background: var(--error-red);
      color: #ffffff;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 15px;
      font-weight: 500;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 24px;
      padding: 16px 0;
    }

    .pagination button {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--dark-bg);
      cursor: pointer;
      font-size: 14px;
      color: var(--light-text);
      transition: all 0.2s ease-in-out;
    }

    .pagination button:hover:not(.disabled) {
      background: var(--light-hover-bg);
      border-color: var(--primary-blue);
    }

    .pagination button.active {
      background: var(--primary-blue);
      color: #ffffff;
      border-color: var(--primary-blue);
      font-weight: 600;
    }

    .pagination button.disabled {
      color: var(--medium-text);
      cursor: not-allowed;
      opacity: 0.6;
      pointer-events: none;
    }

    .pagination-ellipsis {
      padding: 0 8px;
      color: var(--medium-text);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .filter-row {
        flex-direction: column;
      }
      .pagination {
        flex-wrap: wrap;
        justify-content: center;
      }
      .pagination button {
        min-width: 40px;
      }
    }

    .results-table th.sortable {
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease-in-out;
    }

    .results-table th.sortable:hover {
      background: var(--light-hover-bg);
    }

    .sort-indicator {
      display: inline-block;
      margin-left: 6px;
      font-size: 10px;
      color: var(--medium-text);
      width: 12px;
      text-align: center;
      transition: color 0.2s ease-in-out;
    }

    .results-table th.sort-active .sort-indicator {
      color: var(--primary-blue);
    }
  </style>
  <script>
    /* API_BASE: localhost en dev, origen sense port en prod (nginx fa proxy a /api/* → :5001) */
    const API_BASE = window.location.hostname === 'localhost'
      ? 'http://localhost:5001'
      : '';
    document.addEventListener('alpine:init', () => {
      Alpine.data('cercador', () => ({
        state: 'loading',
        allRecords: [],
        families: [],

        search: '',
        filterGrado: '',
        filterFamilia: '',
        filterNivel: '',
        hideOld: true,

        currentPage: 1,
        pageSize: 50,
        sortCol: '',    // '' | 'denominacion' | 'codigo'
        sortDir: 0,     // 0 = original, 1 = A→Z, -1 = Z→A

        async init() {
          try {
            const res = await fetch(API_BASE + '/api/ofertes');
            if (!res.ok) { this.state = 'error'; return; }
            const data = await res.json();
            this.allRecords = data.map(r => ({
              ...r,
              _normDen: (r.denominacion || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(),
              _normCod: (r.codigo || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
            }));
            this.families = [...new Set(data.map(r => r.familia))].sort();
            this.state = 'ready';
          } catch (e) {
            this.state = 'error';
          }
        },

        get filteredRecords() {
          const q = this.search.normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
          const result = this.allRecords.filter(r => {
            if (this.hideOld && r.plan_antiguo) return false;
            if (this.filterGrado && r.grado !== this.filterGrado) return false;
            if (this.filterFamilia && r.familia !== this.filterFamilia) return false;
            if (this.filterNivel && r.nivel !== parseInt(this.filterNivel)) return false;
            if (q && !r._normDen.includes(q) && !r._normCod.includes(q)) return false;
            return true;
          });
          if (this.sortDir !== 0) {
            const col = this.sortCol;
            const dir = this.sortDir;
            result.sort((a, b) => {
              const va = (a[col] ?? '').toLowerCase();
              const vb = (b[col] ?? '').toLowerCase();
              return va < vb ? -dir : va > vb ? dir : 0;
            });
          }
          return result;
        },

        get filteredCount() {
          return this.filteredRecords.length;
        },

        get pagedRecords() {
          const start = (this.currentPage - 1) * this.pageSize;
          return this.filteredRecords.slice(start, start + this.pageSize);
        },

        get totalPages() {
          return Math.ceil(this.filteredRecords.length / this.pageSize);
        },

        buildPagination() {
          const c = this.currentPage, m = this.totalPages, delta = 2;
          if (m <= 1) return [];
          const left = c - delta, right = c + delta + 1;
          const range = [], result = [];
          let l;
          for (let i = 1; i <= m; i++) {
            if (i === 1 || i === m || (i >= left && i < right)) range.push(i);
          }
          for (const i of range) {
            if (l) {
              if (i - l === 2) result.push({ type: 'page', n: l + 1 });
              else if (i - l !== 1) result.push({ type: 'ellipsis' });
            }
            result.push({ type: 'page', n: i });
            l = i;
          }
          return result;
        },

        goToPage(n) {
          if (n < 1 || n > this.totalPages) return;
          this.currentPage = n;
          document.getElementById('results-table')?.scrollIntoView({ behavior: 'smooth' });
        },

        resetPage() {
          this.currentPage = 1;
        },

        sortBy(col) {
          if (this.sortCol !== col) {
            this.sortCol = col;
            this.sortDir = 1;
          } else {
            if (this.sortDir === 1) this.sortDir = -1;
            else { this.sortCol = ''; this.sortDir = 0; }
          }
          this.resetPage();
        }
      }));
    });
  </script>
  <!-- IMPORTANT: CDN Alpine SEMPRE DESPRES del script propi (Pitfall 5) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.11/dist/cdn.min.js"></script>
</head>

<body>
  <div class="page-container" x-data="cercador">
    <h1>Cercador de Graus de Formació Professional</h1>

    <!-- Estat loading (D-10) -->
    <div x-show="state === 'loading'" class="loading-state" role="status">
      <div class="spinner"></div>
      <p>Carregant dades del catàleg FP...</p>
    </div>

    <!-- Estat error 503 (D-11) sense boto retry -->
    <div x-show="state === 'error'" class="error-state" role="status">
      <p>&#9888;&#65039; Les dades del catàleg no estan disponibles. Contacteu l'administrador del sistema.</p>
    </div>

    <!-- Contingut principal -->
    <div x-show="state === 'ready'">
      <!-- Fila de filtres (D-06 ordre: cerca, grado, familia, nivell) -->
      <div class="filter-row">
        <label for="search" class="sr-only">Cerca</label>
        <input type="search" id="search" x-model.debounce.250ms="search" @input="resetPage()"
          placeholder="Cerca per denominació o codi..." autocomplete="off">

        <label for="filter-grado" class="sr-only">Grau</label>
        <select id="filter-grado" x-model="filterGrado" @change="resetPage()">
          <option value="">Tots els graus</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="E">E</option>
        </select>

        <label for="filter-familia" class="sr-only">Família</label>
        <select id="filter-familia" x-model="filterFamilia" @change="resetPage()">
          <option value="">Totes les famílies</option>
          <template x-for="fam in families" :key="fam">
            <option :value="fam" x-text="fam"></option>
          </template>
        </select>

        <label for="filter-nivel" class="sr-only">Nivell</label>
        <select id="filter-nivel" x-model="filterNivel" @change="resetPage()">
          <option value="">Tots els nivells</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>

      <!-- Fila checkbox + comptador (D-06) -->
      <div class="controls-row">
        <label for="hide-old">
          <input type="checkbox" id="hide-old" x-model="hideOld" @change="resetPage()">
          Ocultar pla antic
        </label>
        <span class="counter"
          x-text="filteredCount === 1 ? '1 resultat' : (filteredCount === 0 ? 'Cap resultat' : filteredCount + ' resultats')"></span>
      </div>

      <!-- Taula (D-07: columnes Denominació | Codi | Família | Grado | Nivell) -->
      <table class="results-table" id="results-table">
        <caption class="sr-only">Resultats del cercador de Graus A, B, C i D</caption>
        <thead>
          <tr>
            <th scope="col" class="sortable" :class="{ 'sort-active': sortCol === 'denominacion' }"
              @click="sortBy('denominacion')"
              :aria-sort="sortCol === 'denominacion' ? (sortDir === 1 ? 'ascending' : 'descending') : 'none'">
              Denominació<span class="sort-indicator" aria-hidden="true"
                x-text="sortCol === 'denominacion' ? (sortDir === 1 ? '▲' : '▼') : '⇅'"></span>
            </th>
            <th scope="col" class="sortable" :class="{ 'sort-active': sortCol === 'codigo' }" @click="sortBy('codigo')"
              :aria-sort="sortCol === 'codigo' ? (sortDir === 1 ? 'ascending' : 'descending') : 'none'">
              Codi<span class="sort-indicator" aria-hidden="true"
                x-text="sortCol === 'codigo' ? (sortDir === 1 ? '▲' : '▼') : '⇅'"></span>
            </th>
            <th scope="col">Família</th>
            <th scope="col">Grau</th>
            <th scope="col">Nivell</th>
          </tr>
        </thead>
        <tbody>
          <!-- Estat buit dins la taula (D-12) diferenciat de l'error 503 -->
          <template x-if="filteredCount === 0">
            <tr class="empty-row">
              <td colspan="5">Cap resultat coincideix amb els filtres aplicats.</td>
            </tr>
          </template>
          <!-- Files de dades: x-for sobre pagedRecords (max 50 tr al DOM - SRCH-09) -->
          <template x-for="row in pagedRecords" :key="row.id">
            <tr>
              <td>
                <!-- x-text escapa HTML mai x-html (seguretat XSS) -->
                <span x-text="row.denominacion"></span>
                <!-- Badge Pla antic (D-08): inline a Denominació, no columna separada -->
                <span x-show="row.plan_antiguo" class="badge-old">Pla antic</span>
              </td>
              <td x-text="row.codigo ?? '—'"></td>
              <td x-text="row.familia"></td>
              <td x-text="row.grado"></td>
              <td x-text="row.nivel ?? '—'"></td>
            </tr>
          </template>
        </tbody>
      </table>

      <!-- Paginació (D-02) -->
      <nav class="pagination" aria-label="Paginació de resultats" x-show="totalPages > 1">
        <button @click="goToPage(currentPage - 1)" :aria-disabled="currentPage === 1"
          :class="{ disabled: currentPage === 1 }">Anterior</button>

        <template x-for="item in buildPagination()" :key="JSON.stringify(item)">
          <template x-if="item.type === 'page'">
            <button @click="goToPage(item.n)" :aria-current="item.n === currentPage ? 'page' : false"
              :aria-label="'Pàgina ' + item.n" :class="{ active: item.n === currentPage }" x-text="item.n"></button>
          </template>
          <template x-if="item.type === 'ellipsis'">
            <span class="pagination-ellipsis">&#8230;</span>
          </template>
        </template>

        <button @click="goToPage(currentPage + 1)" :aria-disabled="currentPage === totalPages"
          :class="{ disabled: currentPage === totalPages }">Següent</button>
      </nav>
    </div>
  </div>
</body>

</html>
