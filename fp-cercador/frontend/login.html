<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page.title.login">Inicia sessió — Cercador Graus FP</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display:ital@0;1&display=swap"
    rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark: #1c1410;
      --warm: #8a7060;
      --warm2: #f5ece2;
      --border: #e8ddd4;
      --bg: #fdf8f2;
      --white: #ffffff;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      color: var(--dark);
      background: var(--bg);
      min-height: 100vh;
    }

    .topbar { background: var(--dark); padding: 0 48px; }
    .topbar-inner { display: flex; align-items: center; height: 52px; }
    .topbar-logo {
      font-family: 'DM Serif Display', serif;
      color: var(--white);
      font-size: 20px;
      letter-spacing: -0.3px;
      text-decoration: none;
    }

    .auth-page {
      max-width: 400px;
      margin: 64px auto;
      padding: 0 24px;
    }

    .auth-page h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 32px;
      font-weight: 400;
      color: var(--dark);
      margin-bottom: 28px;
    }

    .msg {
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      background: var(--warm2);
    }
    .msg--error { background: #fde8e8; border-color: #e8a0a0; color: #7a1515; }
    .msg--ok { background: #e8f5e8; border-color: #8ec98e; color: #1a521a; }

    form { display: flex; flex-direction: column; gap: 14px; }

    label { font-size: 13px; font-weight: 500; color: var(--dark); margin-bottom: 2px; }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      background: var(--white);
      color: var(--dark);
      transition: border-color 0.15s;
    }
    input:focus { outline: none; border-color: var(--warm); }

    .field { display: flex; flex-direction: column; gap: 4px; }

    button[type="submit"] {
      padding: 10px;
      background: var(--dark);
      color: var(--white);
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button[type="submit"]:hover { opacity: 0.85; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    .auth-links {
      margin-top: 16px;
      font-size: 13px;
      color: var(--warm);
      text-align: center;
    }
    .auth-links a { color: var(--dark); }

    /* ── Lang selector ── */
    .lang-selector { display: flex; align-items: center; gap: 2px; margin-left: auto; }
    .lang-btn {
      font-size: 11px; font-weight: 700; font-family: inherit;
      padding: 3px 8px; border-radius: 3px; cursor: pointer;
      background: transparent; border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.6); letter-spacing: 0.04em;
      transition: background 0.15s, color 0.15s;
    }
    .lang-btn:hover { background: rgba(255,255,255,0.12); color: var(--white); }
    .lang-btn--active { background: rgba(255,255,255,0.18); color: var(--white); border-color: rgba(255,255,255,0.6); }
    .google-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 10px 16px; border-radius: 4px;
      border: 1px solid var(--border); background: var(--white);
      color: var(--dark); text-decoration: none; font-size: 14px; font-weight: 500;
      font-family: inherit; cursor: pointer; transition: background 0.15s;
      margin-bottom: 4px;
    }
    .google-btn:hover { background: var(--warm2); }
    .auth-separator {
      display: flex; align-items: center; gap: 12px;
      margin: 16px 0; color: var(--warm); font-size: 12px;
    }
    .auth-separator::before, .auth-separator::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
  </style>
  <script src="i18n.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="topbar-logo" href="index.html">GrausFP</a>
      <div class="lang-selector" aria-label="Language selector">
        <button class="lang-btn" data-lang="ca" onclick="setLang('ca')">CA</button>
        <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
      </div>
    </div>
  </div>

  <div class="auth-page">
    <h1 data-i18n="login.h1">Inicia sessió</h1>
    <p id="msg" class="msg" hidden></p>

    <a id="btn-google" href="/api/auth/google" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      <span data-i18n="auth.google.btn">Continua amb Google</span>
    </a>

    <div class="auth-separator">
      <span data-i18n="auth.google.separator">o</span>
    </div>

    <form id="form-login">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="el-teu@email.com">
      </div>
      <div class="field">
        <label for="password" data-i18n="login.pw.label">Contrasenya</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="········">
      </div>
      <button type="submit" id="btn-submit" data-i18n="login.btn.submit">Entra</button>
    </form>
    <p class="auth-links"><a href="forgot-password.html" data-i18n="login.link.forgot">Has oblidat la contrasenya?</a></p>
    <p class="auth-links" data-i18n="login.link.register">Sense compte? <a href="register.html">Registra't</a></p>
  </div>

  <script>
    const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:5001' : '';
    const msgEl = document.getElementById('msg');
    const btn = document.getElementById('btn-submit');

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className = 'msg msg--' + type;
      msgEl.hidden = false;
    }

    // Mostra avís si ve de verificació d'email
    if (new URLSearchParams(window.location.search).get('verified') === '1') {
      showMsg(t('login.msg.verified'), 'ok');
    }

    document.getElementById('form-login').addEventListener('submit', async function (e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = t('login.btn.submitting');
      try {
        const res = await fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = data.user && data.user.is_admin ? 'admin.html' : 'index.html';
        } else {
          showMsg(data.error || t('login.err.default'), 'error');
          btn.disabled = false;
          btn.textContent = t('login.btn.submit');
        }
      } catch (_) {
        showMsg(t('login.err.network'), 'error');
        btn.disabled = false;
        btn.textContent = t('login.btn.submit');
      }
    });
  </script>
</body>
</html>
