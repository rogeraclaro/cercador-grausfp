<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial d'actualitzacions — Cercador Graus FP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display:ital@0;1&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark: #1c1410;
      --warm: #8a7060;
      --warm2: #f5ece2;
      --border: #e8ddd4;
      --bg: #fdf8f2;
      --white: #ffffff;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      color: var(--dark);
      background: var(--bg);
    }

    .topbar { background: var(--dark); padding: 0 48px; }
    .topbar-inner { display: flex; align-items: center; height: 52px; }
    .topbar-logo {
      font-family: 'DM Serif Display', serif;
      color: var(--white);
      font-size: 20px;
      letter-spacing: -0.3px;
      text-decoration: none;
    }

    .hero {
      border-bottom: 2px solid var(--dark);
      padding: 40px 48px 32px;
    }

    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 48px;
      font-weight: 400;
      line-height: 1.05;
      color: var(--dark);
      margin-bottom: 10px;
    }

    .hero-sub { font-size: 15px; color: var(--warm); }

    .content { padding: 28px 48px 64px; }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .results-table thead tr {
      background: var(--warm2);
      border-bottom: 2px solid var(--dark);
    }

    .results-table th {
      text-align: left;
      padding: 11px 16px;
      font-weight: 600;
      color: var(--dark);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .results-table th.col-num { text-align: center; width: 50px; }
    .results-table th.col-grado { text-align: center; width: 80px; }
    .results-table th.col-dur { text-align: right; width: 90px; }
    .results-table th.col-changes { width: 260px; }

    .changes-list { list-style: none; padding: 0; margin: 0; font-size: 12px; line-height: 1.7; }
    .changes-list .new  { color: #166534; }
    .changes-list .gone { color: #991b1b; }
    .changes-list .delta { color: var(--warm); }
    .changes-list .warn  { color: #92400e; }
    .no-changes { color: var(--warm); font-style: italic; font-size: 12px; }
    .first-entry { color: var(--warm); font-size: 12px; }

    .results-table td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .results-table td.col-num { text-align: center; color: var(--warm); font-size: 13px; }
    .results-table td.col-date {
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      white-space: nowrap;
    }
    .results-table td.col-total { font-weight: 600; }
    .results-table td.col-grado { text-align: center; color: var(--warm); }
    .results-table td.col-dur { text-align: right; color: var(--warm); font-family: 'Geist Mono', monospace; font-size: 12px; }

    .results-table tbody tr:hover td { background: var(--warm2); }
    .results-table tbody tr:last-child td { border-bottom: none; }

    .empty-state {
      text-align: center;
      color: var(--warm);
      padding: 64px 48px;
      font-style: italic;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state {
      display: flex; flex-direction: column; align-items: center;
      gap: 16px; padding: 64px 48px; color: var(--warm);
    }
    .spinner {
      border: 3px solid var(--border);
      border-top-color: var(--dark);
      border-radius: 50%;
      width: 32px; height: 32px;
      animation: spin 0.8s linear infinite;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px 48px;
      text-align: right;
    }

    footer a { font-size: 13px; color: var(--warm); text-decoration: none; }
    footer a:hover { color: var(--dark); }

    @media (max-width: 768px) {
      .topbar { padding: 0 16px; }
      .hero { padding: 24px 16px 20px; }
      .hero h1 { font-size: 30px; }
      .content { padding: 16px 16px 32px; }
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .results-table { min-width: 520px; }
      footer { padding: 20px 16px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="topbar-logo">GrausFP</a>
    </div>
  </header>

  <div class="hero">
    <h1>Historial<br><em>d'actualitzacions</em></h1>
    <p class="hero-sub">Registre de les darreres actualitzacions del catàleg FP</p>
  </div>

  <main class="content" id="main-content">
    <div class="loading-state" id="loading">
      <div class="spinner"></div>
      <p>Carregant historial...</p>
    </div>
  </main>

  <footer>
    <a href="index.html">← Tornar al cercador</a>
  </footer>

  <script>
    const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:5001' : '';

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString('ca-ES', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    async function load() {
      const main = document.getElementById('main-content');
      try {
        const res = await fetch(API_BASE + '/api/refresh-history');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const history = await res.json();

        if (!history.length) {
          main.innerHTML = '<p class="empty-state">Encara no hi ha cap actualització registrada.</p>';
          return;
        }

        const graus = ['A', 'B', 'C', 'D', 'E'];
        const gradoCols = graus.map(g =>
          `<th class="col-grado" scope="col">Grau ${g}</th>`
        ).join('');

        function renderChanges(entry) {
          const c = entry.changes;
          if (c === null || c === undefined) {
            return '<span class="first-entry">Primer registre</span>';
          }
          if (!c.has_changes && !(entry.unknown_families?.length)) {
            return '<span class="no-changes">Sense canvis</span>';
          }
          const items = [];
          for (const f of (c.new_families || [])) {
            items.push(`<li class="new">+ Família: ${f}</li>`);
          }
          for (const f of (c.removed_families || [])) {
            items.push(`<li class="gone">− Família: ${f}</li>`);
          }
          for (const [g, d] of Object.entries(c.grado_deltas || {})) {
            const sign = d > 0 ? '+' : '';
            items.push(`<li class="delta">Grau ${g}: ${sign}${d}</li>`);
          }
          for (const d of (c.new_denominacions || [])) {
            items.push(`<li class="new">+ ${d}</li>`);
          }
          for (const d of (c.removed_denominacions || [])) {
            items.push(`<li class="gone">− ${d}</li>`);
          }
          for (const f of (entry.unknown_families || [])) {
            items.push(`<li class="warn">⚠ Família nova: ${f}</li>`);
          }
          return `<ul class="changes-list">${items.join('')}</ul>`;
        }

        const rows = history.map((entry, i) => {
          const gradoCells = graus.map(g => {
            const n = entry.by_grado?.[g];
            return `<td class="col-grado">${n != null ? n : '—'}</td>`;
          }).join('');
          return `<tr>
            <td class="col-num">${i + 1}</td>
            <td class="col-date">${formatDate(entry.ts)}</td>
            <td class="col-total">${entry.total ?? '—'}</td>
            ${gradoCells}
            <td class="col-dur">${entry.duration_seconds != null ? entry.duration_seconds + ' s' : '—'}</td>
            <td>${renderChanges(entry)}</td>
          </tr>`;
        }).join('');

        main.innerHTML = `
          <div class="table-wrap">
            <table class="results-table">
              <thead>
                <tr>
                  <th class="col-num" scope="col">#</th>
                  <th scope="col">Data</th>
                  <th scope="col">Total</th>
                  ${gradoCols}
                  <th class="col-dur" scope="col">Durada</th>
                  <th class="col-changes" scope="col">Novetats</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
      } catch (e) {
        main.innerHTML = '<p class="empty-state" style="color:#991b1b;">Error carregant l\'historial.</p>';
      }
    }

    load();
  </script>
</body>
</html>
