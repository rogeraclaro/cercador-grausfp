<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page.title.lists">Les meves llistes — Cercador Graus FP</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display:ital@0;1&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="site.css?v=6">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: var(--fs-body);
      color: var(--dark);
      background: var(--bg);
    }

    [x-cloak] { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .hero {
      border-bottom: 2px solid var(--dark);
      padding: 40px 48px 28px;
    }

    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: var(--fs-display);
      font-weight: 400;
      line-height: 1.05;
      margin-bottom: 10px;
    }

    .hero-sub {
      font-size: var(--fs-lead);
      color: var(--warm);
      max-width: 62ch;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
      gap: 48px;
      padding: 32px 48px 64px;
      align-items: start;
      min-height: 50vh;
    }

    h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 14px;
    }

    .label {
      display: block;
      font-size: var(--fs-label);
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--warm);
      margin-bottom: 6px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      font-family: inherit;
      font-size: var(--fs-input);
      color: var(--dark);
      background: var(--white);
      border: 1px solid var(--dark);
      border-radius: 2px;
      padding: 10px 12px;
    }

    textarea {
      resize: vertical;
      line-height: 1.45;
    }

    .btn {
      font-family: inherit;
      font-size: var(--fs-small);
      font-weight: 600;
      color: var(--dark);
      background: var(--white);
      border: 1px solid var(--dark);
      border-radius: 2px;
      padding: 8px 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover { background: var(--dark); color: var(--white); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.primary { background: var(--dark); color: var(--white); }
    .btn.primary:hover { background: var(--ink-soft); }
    .btn.danger { border-color: var(--alert-ink); color: var(--alert-ink); }
    .btn.danger:hover { background: var(--alert-ink); color: var(--white); }

    .link-btn {
      font-family: inherit;
      font-size: var(--fs-small);
      color: var(--dark);
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      padding: 4px 0;
    }

    .hint {
      font-size: var(--fs-small);
      color: var(--warm);
      line-height: 1.5;
    }

    .hint a { color: var(--dark); }

    .error {
      font-size: var(--fs-small);
      color: var(--alert-ink);
      margin-top: 8px;
    }

    .saved {
      font-size: var(--fs-label);
      font-weight: 600;
      color: var(--ok-ink);
    }

    .saved.failed { color: var(--alert-ink); }

    /* Columna de llistes */
    .lists {
      list-style: none;
      border-top: 1px solid var(--dark);
      margin-bottom: 20px;
    }

    .lists button {
      display: block;
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: var(--fs-body);
      color: var(--dark);
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      border-left: 3px solid transparent;
      padding: 10px 10px 10px 9px;
      cursor: pointer;
    }

    .lists button:hover { background: var(--warm2); }

    .lists button[aria-current="true"] {
      background: var(--white);
      border-left-color: var(--dark);
      font-weight: 600;
    }

    .lists .name { display: block; overflow-wrap: anywhere; }

    .lists .meta {
      display: block;
      margin-top: 2px;
      font-family: 'Geist Mono', monospace;
      font-size: var(--fs-label);
      font-weight: 400;
      color: var(--warm);
    }

    .new-list {
      display: flex;
      gap: 8px;
    }

    .new-list input { flex: 1; min-width: 0; }

    /* Editor */
    .state {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 28px;
      color: var(--ink-soft);
      line-height: 1.55;
    }

    .warn {
      font-size: var(--fs-small);
      color: var(--amber-ink);
      background: var(--amber-bg);
      border-left: 2px solid var(--amber-ink);
      padding: 10px 12px;
      margin-bottom: 20px;
    }

    .field { margin-bottom: 18px; }

    .field-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .block {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 2px solid var(--dark);
    }

    .items { list-style: none; border-top: 1px solid var(--dark); }

    .items li {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .item-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .item-head .name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
    .item-head .name a { color: var(--dark); }

    .grade {
      flex-shrink: 0;
      font-family: 'Geist Mono', monospace;
      font-size: var(--fs-label);
      font-weight: 500;
      border: 1px solid var(--dark);
      border-radius: 2px;
      padding: 1px 5px;
    }

    .code {
      font-family: 'Geist Mono', monospace;
      font-size: var(--fs-label);
      font-weight: 400;
      color: var(--warm);
    }

    .gone {
      font-size: var(--fs-label);
      color: var(--amber-ink);
      background: var(--amber-bg);
      border-radius: 2px;
      padding: 0 5px;
    }

    .remove {
      flex-shrink: 0;
      align-self: center;
      width: 28px;
      height: 28px;
      font-size: 14px;
      line-height: 1;
      color: var(--warm);
      background: none;
      border: 1px solid transparent;
      border-radius: 2px;
      cursor: pointer;
    }

    .remove:hover { color: var(--alert-ink); border-color: var(--alert-edge); background: var(--alert-bg); }

    .note { margin-top: 8px; }
    .note textarea { font-size: var(--fs-body); min-height: 2.9em; }

    .note-foot {
      display: flex;
      justify-content: flex-end;
      min-height: 16px;
      margin-top: 2px;
    }

    /* Compartir */
    .share {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 168px;
      gap: 24px;
      align-items: start;
    }

    .share-url {
      font-family: 'Geist Mono', monospace;
      font-size: var(--fs-mono) !important;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      margin-top: 12px;
    }

    .qr {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 4px;
      line-height: 0;
    }

    .qr svg { width: 100%; height: auto; }

    input:focus-visible,
    textarea:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--dark);
      outline-offset: 2px;
    }

    @media (max-width: 900px) {
      .content {
        grid-template-columns: minmax(0, 1fr);
        gap: 32px;
      }
    }

    @media (max-width: 768px) {
      .hero { padding: 24px 16px 20px; }
      .hero h1 { font-size: var(--fs-display-sm); }
      .content { padding: 20px 16px 40px; }
      .share { grid-template-columns: minmax(0, 1fr); }
      .qr { max-width: 168px; }
    }

    @media (pointer: coarse) {
      .remove { width: 44px; height: 44px; }
      .btn, .link-btn, .lists button { min-height: 44px; }
    }
  </style>
  <script src="i18n.js?v=20261127"></script>
  <script src="auth.js?v=20261117b"></script>
  <script>
    const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:5001' : '';
    const FLASH_MS = 2000;

    // QR de l'enllaç com a SVG en línia; '' si la llibreria no ha carregat (la pàgina funciona igual).
    function qrSvg(text) {
      if (typeof qrcode !== 'function') return '';
      try {
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        return qr.createSvgTag({ cellSize: 4, margin: 8, scalable: true });
      } catch (e) { return ''; }
    }

    async function api(method, path, body) {
      const opts = { method, credentials: 'include' };
      if (body !== undefined) {
        opts.headers = { 'Content-Type': 'application/json' };
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(API_BASE + path, opts);
      if (res.status === 401) { location.replace('login.html?next=llistes.html'); throw new Error('401'); }
      return res;
    }

    document.addEventListener('alpine:init', () => {
      Alpine.data('llistes', () => ({
        state: 'loading',     // loading | ready | error
        lists: [],
        current: null,        // llista oberta a l'editor (resposta de GET /api/lists/<id>)
        newName: '',
        createError: '',
        saved: {},            // camp → 'ok' | 'failed' (indicador «Desat»)
        confirming: '',       // '' | 'delete' | 'regenerate'
        copied: false,
        shareError: false,

        async init() {
          try {
            const res = await api('GET', '/api/lists');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            this.lists = await res.json();
            this.state = 'ready';
            const wanted = Number(new URLSearchParams(location.search).get('l'));
            const first = this.lists.find(l => l.id === wanted) || this.lists[0];
            if (first) this.open(first.id);
          } catch (e) {
            if (e.message !== '401') this.state = 'error';
          }
        },

        async open(id) {
          this.confirming = '';
          this.copied = false;
          this.shareError = false;
          this.saved = {};
          try {
            const res = await api('GET', '/api/lists/' + id);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            this.current = await res.json();
          } catch (e) {
            if (e.message !== '401') this.state = 'error';
          }
        },

        // Manté al dia la fila de la columna de llistes.
        sync() {
          const row = this.lists.find(l => l.id === this.current.id);
          if (!row) return;
          row.name = this.current.name;
          row.n_items = this.current.items.length;
          row.shared = !!this.current.share_token;
        },

        flash(field, ok) {
          this.saved = { ...this.saved, [field]: ok ? 'ok' : 'failed' };
          if (ok) setTimeout(() => {
            if (this.saved[field] === 'ok') this.saved = { ...this.saved, [field]: '' };
          }, FLASH_MS);
        },

        savedText(field) {
          return this.saved[field] === 'ok' ? t('lists.saved') : this.saved[field] === 'failed' ? t('lists.save_failed') : '';
        },

        async create() {
          const name = this.newName.trim();
          this.createError = '';
          if (!name) return;
          try {
            const res = await api('POST', '/api/lists', { name });
            if (res.status === 429) { this.createError = t('lists.max_lists'); return; }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const made = await res.json();
            this.lists.unshift({ id: made.id, name: made.name, message: null, n_items: 0, shared: false });
            this.newName = '';
            await this.open(made.id);
          } catch (e) {
            if (e.message !== '401') this.createError = t('lists.error');
          }
        },

        async saveField(field) {
          const value = this.current[field] || '';
          if (field === 'name' && !value.trim()) { this.flash(field, false); return; }
          try {
            const res = await api('PATCH', '/api/lists/' + this.current.id, { [field]: value });
            this.flash(field, res.ok);
            if (res.ok) this.sync();
          } catch (e) { this.flash(field, false); }
        },

        async saveNote(item) {
          try {
            const res = await api('PUT', '/api/lists/' + this.current.id + '/items/' + encodeURIComponent(item.ref),
              { notes: item.notes || '' });
            this.flash('n:' + item.ref, res.ok);
          } catch (e) { this.flash('n:' + item.ref, false); }
        },

        async removeItem(item) {
          try {
            const res = await api('DELETE', '/api/lists/' + this.current.id + '/items/' + encodeURIComponent(item.ref));
            if (!res.ok) return;
            this.current.items = this.current.items.filter(i => i.ref !== item.ref);
            this.sync();
          } catch (e) { /* es queda a la llista; es pot tornar a provar */ }
        },

        async removeList() {
          try {
            const res = await api('DELETE', '/api/lists/' + this.current.id);
            if (!res.ok) return;
            this.lists = this.lists.filter(l => l.id !== this.current.id);
            this.current = null;
            this.confirming = '';
            if (this.lists.length) this.open(this.lists[0].id);
          } catch (e) { /* es queda oberta */ }
        },

        async share() {
          this.shareError = false;
          try {
            const res = await api('POST', '/api/lists/' + this.current.id + '/share');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            this.current.share_token = (await res.json()).share_token;
            this.confirming = '';
            this.copied = false;
            this.sync();
          } catch (e) { this.shareError = true; }
        },

        async unshare() {
          this.shareError = false;
          try {
            const res = await api('DELETE', '/api/lists/' + this.current.id + '/share');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            this.current.share_token = null;
            this.sync();
          } catch (e) { this.shareError = true; }
        },

        get shareUrl() {
          return this.current && this.current.share_token
            ? new URL('llista.html?t=' + this.current.share_token, location.href).toString() : '';
        },

        get shareQr() { return this.shareUrl ? qrSvg(this.shareUrl) : ''; },

        copy() {
          navigator.clipboard.writeText(this.shareUrl).then(() => {
            this.copied = true;
            setTimeout(() => { this.copied = false; }, FLASH_MS);
          }, () => { this.$refs.shareUrl.select(); });
        },

        countLabel(n) { return t(n === 1 ? 'lists.count_one' : 'lists.count', { n }); },

        // Pàgina pública del grau (/grau/<ref>; en local, directament a Flask), com a index.html.
        grauUrl(ref) { return (API_BASE ? API_BASE + '/api' : '') + '/grau/' + encodeURIComponent(ref); },
      }));
    });
  </script>
  <script defer src="vendor/qrcode-generator-2.0.4.js"></script>
  <script defer src="vendor/alpinejs-3.15.11.min.js"></script>
  <script defer src="https://analytics.masellas.info/script.js" data-exclude-search="true" data-exclude-hash="true" data-website-id="ddb6c664-550b-4e2d-848f-796a676e4036"></script>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="topbar-logo">GrausFP</a>
      <a class="auth-btn topbar-centres" href="https://centres.grausfp.es/" data-lang-href="https://centres.grausfp.es/" target="_blank" rel="noopener" data-i18n="nav.centres">Centres</a>
      <a class="auth-btn topbar-gap" href="que-em-falta.html" data-i18n="nav.gap">Què em falta?</a>
      <div id="auth-widget"></div>
      <div class="lang-selector" aria-label="Language selector">
        <button class="lang-btn" data-lang="ca" onclick="setLang('ca')">CA</button>
        <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
      </div>
    </div>
  </header>

  <div class="hero">
    <h1 data-i18n="lists.h1">Les meves llistes</h1>
    <p class="hero-sub" data-i18n="lists.sub">Prepara una tria de graus, anota-la i comparteix-la amb un enllaç o un codi QR.</p>
  </div>

  <main class="content" x-data="llistes">

    <section aria-labelledby="lists-title">
      <h2 id="lists-title" data-i18n="lists.col.title">Llistes</h2>

      <p class="hint" x-show="state === 'loading'" x-text="t('lists.loading')"></p>
      <p class="error" role="alert" x-show="state === 'error'" x-cloak x-text="t('lists.error')"></p>

      <ul class="lists" x-show="lists.length" x-cloak>
        <template x-for="l in lists" :key="l.id">
          <li>
            <button type="button" @click="open(l.id)" :aria-current="current && current.id === l.id ? 'true' : 'false'">
              <span class="name" x-text="l.name"></span>
              <span class="meta" x-text="countLabel(l.n_items) + (l.shared ? ' · ' + t('lists.shared_tag') : '')"></span>
            </button>
          </li>
        </template>
      </ul>

      <form x-show="state === 'ready'" x-cloak @submit.prevent="create()">
        <label class="label" for="new-list" data-i18n="lists.new.label">Llista nova</label>
        <div class="new-list">
          <input id="new-list" type="text" maxlength="80" autocomplete="off" x-model="newName"
            data-i18n-placeholder="lists.new.placeholder" placeholder="Nom de la llista">
          <button type="submit" class="btn primary" :disabled="!newName.trim()" x-text="t('lists.new.submit')"></button>
        </div>
        <p class="error" role="alert" x-show="createError" x-text="createError"></p>
      </form>
    </section>

    <section aria-labelledby="editor-title">
      <div class="state" x-show="state === 'ready' && !current" x-cloak>
        <p x-text="lists.length ? t('lists.pick') : t('lists.empty')"></p>
      </div>

      <template x-if="current">
        <div>
          <h2 id="editor-title" class="sr-only" x-text="t('lists.editor.title', {name: current.name})"></h2>
          <p class="warn" x-text="t('lists.warn')"></p>

          <div class="field">
            <div class="field-head">
              <label class="label" for="list-name" x-text="t('lists.name')"></label>
              <span class="saved" :class="{ failed: saved.name === 'failed' }" aria-live="polite" x-text="savedText('name')"></span>
            </div>
            <input id="list-name" type="text" maxlength="80" autocomplete="off" x-model="current.name" @change="saveField('name')">
          </div>

          <div class="field">
            <div class="field-head">
              <label class="label" for="list-message" x-text="t('lists.message')"></label>
              <span class="saved" :class="{ failed: saved.message === 'failed' }" aria-live="polite" x-text="savedText('message')"></span>
            </div>
            <textarea id="list-message" rows="3" maxlength="500" x-model="current.message" @change="saveField('message')"
              :placeholder="t('lists.message.placeholder')"></textarea>
          </div>

          <h2 x-text="t('lists.items.title') + ' (' + current.items.length + ')'"></h2>
          <p class="hint" x-show="!current.items.length">
            <span x-text="t('lists.items.empty')"></span>
            <a href="index.html" x-text="t('lists.items.go_search')"></a>
          </p>
          <ul class="items" x-show="current.items.length">
            <template x-for="item in current.items" :key="item.ref">
              <li>
                <div class="item-head">
                  <span class="grade" x-show="item.grado" x-text="item.grado"></span>
                  <span class="name">
                    <template x-if="item.disponible">
                      <span><a :href="grauUrl(item.ref)" x-text="item.denominacion"></a>
                        <span class="code" x-show="item.codigo" x-text="item.codigo"></span></span>
                    </template>
                    <template x-if="!item.disponible">
                      <span><span class="code" x-text="item.ref"></span> <span class="gone" x-text="t('lists.item.gone')"></span></span>
                    </template>
                  </span>
                  <button type="button" class="remove" @click="removeItem(item)"
                    :aria-label="t('lists.item.remove', {name: item.denominacion || item.ref})">✕</button>
                </div>
                <div class="note">
                  <label class="sr-only" :for="'note-' + item.ref" x-text="t('lists.item.note_for', {name: item.denominacion || item.ref})"></label>
                  <textarea :id="'note-' + item.ref" rows="2" maxlength="300" x-model="item.notes" @change="saveNote(item)"
                    :placeholder="t('lists.item.note.placeholder')"></textarea>
                  <div class="note-foot">
                    <span class="saved" :class="{ failed: saved['n:' + item.ref] === 'failed' }" aria-live="polite"
                      x-text="savedText('n:' + item.ref)"></span>
                  </div>
                </div>
              </li>
            </template>
          </ul>

          <div class="block">
            <h2 x-text="t('lists.share.title')"></h2>

            <template x-if="!current.share_token">
              <div>
                <p class="hint" x-text="t('lists.share.off')"></p>
                <div class="actions">
                  <button type="button" class="btn primary" @click="share()" x-text="t('lists.share.enable')"></button>
                </div>
              </div>
            </template>

            <template x-if="current.share_token">
              <div class="share">
                <div>
                  <label class="label" for="share-url" x-text="t('lists.share.link')"></label>
                  <input id="share-url" class="share-url" type="text" readonly x-ref="shareUrl" :value="shareUrl" @focus="$el.select()">
                  <div class="actions">
                    <button type="button" class="btn primary" @click="copy()"
                      x-text="copied ? t('lists.share.copied') : t('lists.share.copy')"></button>
                    <a class="btn" :href="shareUrl" target="_blank" rel="noopener" x-text="t('lists.share.preview')"></a>
                  </div>
                  <p class="hint" style="margin-top:14px" x-text="t('lists.share.on')"></p>
                  <div class="actions" x-show="confirming !== 'regenerate'">
                    <button type="button" class="link-btn" @click="confirming = 'regenerate'" x-text="t('lists.share.regenerate')"></button>
                    <button type="button" class="link-btn" @click="unshare()" x-text="t('lists.share.disable')"></button>
                  </div>
                  <div class="actions" x-show="confirming === 'regenerate'" role="alert">
                    <span class="hint" x-text="t('lists.share.regenerate.confirm')"></span>
                    <button type="button" class="btn danger" @click="share()" x-text="t('lists.share.regenerate.yes')"></button>
                    <button type="button" class="btn" @click="confirming = ''" x-text="t('lists.cancel')"></button>
                  </div>
                  <span class="sr-only" aria-live="polite" x-text="copied ? t('lists.share.copied') : ''"></span>
                </div>
                <div class="qr" x-show="shareQr" x-html="shareQr" role="img" :aria-label="t('lists.share.qr')"></div>
              </div>
            </template>
            <p class="error" role="alert" x-show="shareError" x-text="t('lists.error')"></p>
          </div>

          <div class="block">
            <div class="actions" x-show="confirming !== 'delete'" style="margin-top:0">
              <button type="button" class="btn danger" @click="confirming = 'delete'" x-text="t('lists.delete')"></button>
            </div>
            <div class="actions" x-show="confirming === 'delete'" role="alert" style="margin-top:0">
              <span class="hint" x-text="t('lists.delete.confirm', {name: current.name})"></span>
              <button type="button" class="btn danger" @click="removeList()" x-text="t('lists.delete.yes')"></button>
              <button type="button" class="btn" @click="confirming = ''" x-text="t('lists.cancel')"></button>
            </div>
          </div>
        </div>
      </template>
    </section>

  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="footer.js?v=3"></script>
  <script src="feedback.js?v=5"></script>

  <noscript>
    <p>Les meves llistes. Activa JavaScript per crear i compartir llistes de graus.</p>
  </noscript>
</body>

</html>
