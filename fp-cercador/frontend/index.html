<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cercador FP Espanya</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #111827;
      background: #ffffff;
    }

    .page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 24px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 8px;
    }

    input[type="search"], select {
      padding: 8px 16px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 14px;
      background: #ffffff;
      color: #111827;
    }
    input[type="search"] { flex: 1; min-width: 200px; }
    input[type="search"]:focus, select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
    }
    input[type="search"]::placeholder { color: #6b7280; }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
    }
    .controls-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .results-table th {
      background: #f3f4f6;
      text-align: left;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid #d1d5db;
    }
    .results-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: middle;
    }
    .results-table tr:nth-child(even) td { background: #f3f4f6; }

    .badge-old {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 6px;
      white-space: nowrap;
    }

    .empty-row td {
      text-align: center;
      color: #6b7280;
      padding: 32px;
      font-style: italic;
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 48px;
      color: #6b7280;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      border: 3px solid #d1d5db;
      border-top-color: #2563eb;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
    }

    .error-state {
      padding: 16px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 4px;
      margin: 16px 0;
    }

    .pagination {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 16px;
      padding: 16px 0;
    }
    .pagination button {
      padding: 6px 12px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: #ffffff;
      cursor: pointer;
      font-size: 14px;
      color: #111827;
    }
    .pagination button.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    .pagination button.disabled {
      color: #6b7280;
      cursor: default;
      pointer-events: none;
    }
    .pagination-ellipsis {
      padding: 0 4px;
      color: #6b7280;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .filter-row { flex-direction: column; }
    }
  </style>
  <script>
    /* API_BASE: localhost en dev, origen sense port en prod (nginx fa proxy a /api/* → :5001) */
    const API_BASE = window.location.hostname === 'localhost'
      ? 'http://localhost:5001'
      : '';
    document.addEventListener('alpine:init', () => {
      Alpine.data('cercador', () => ({
        state: 'loading',
        allRecords: [],
        families: [],

        search: '',
        filterGrado: '',
        filterFamilia: '',
        filterNivel: '',
        hideOld: true,

        currentPage: 1,
        pageSize: 50,

        async init() {
          try {
            const res = await fetch(API_BASE + '/api/ofertes');
            if (!res.ok) { this.state = 'error'; return; }
            const data = await res.json();
            this.allRecords = data.map(r => ({
              ...r,
              _normDen: (r.denominacion || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(),
              _normCod: (r.codigo || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
            }));
            this.families = [...new Set(data.map(r => r.familia))].sort();
            this.state = 'ready';
          } catch(e) {
            this.state = 'error';
          }
        },

        get filteredRecords() {
          const q = this.search.normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
          return this.allRecords.filter(r => {
            if (this.hideOld && r.plan_antiguo) return false;
            if (this.filterGrado && r.grado !== this.filterGrado) return false;
            if (this.filterFamilia && r.familia !== this.filterFamilia) return false;
            if (this.filterNivel && r.nivel !== parseInt(this.filterNivel)) return false;
            if (q && !r._normDen.includes(q) && !r._normCod.includes(q)) return false;
            return true;
          });
        },

        get filteredCount() {
          return this.filteredRecords.length;
        },

        get pagedRecords() {
          const start = (this.currentPage - 1) * this.pageSize;
          return this.filteredRecords.slice(start, start + this.pageSize);
        },

        get totalPages() {
          return Math.ceil(this.filteredRecords.length / this.pageSize);
        },

        buildPagination() {
          const c = this.currentPage, m = this.totalPages, delta = 2;
          if (m <= 1) return [];
          const left = c - delta, right = c + delta + 1;
          const range = [], result = [];
          let l;
          for (let i = 1; i <= m; i++) {
            if (i === 1 || i === m || (i >= left && i < right)) range.push(i);
          }
          for (const i of range) {
            if (l) {
              if (i - l === 2) result.push({ type: 'page', n: l + 1 });
              else if (i - l !== 1) result.push({ type: 'ellipsis' });
            }
            result.push({ type: 'page', n: i });
            l = i;
          }
          return result;
        },

        goToPage(n) {
          if (n < 1 || n > this.totalPages) return;
          this.currentPage = n;
          document.getElementById('results-table')?.scrollIntoView({ behavior: 'smooth' });
        },

        resetPage() {
          this.currentPage = 1;
        }
      }));
    });
  </script>
  <!-- IMPORTANT: CDN Alpine SEMPRE DESPRES del script propi (Pitfall 5) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.11/dist/cdn.min.js"></script>
</head>
<body>
  <div class="page-container" x-data="cercador">
    <h1>Cercador FP Espanya</h1>

    <!-- Estat loading (D-10) -->
    <div x-show="state === 'loading'" class="loading-state" role="status">
      <div class="spinner"></div>
      <p>Carregant dades del catàleg FP...</p>
    </div>

    <!-- Estat error 503 (D-11) sense boto retry -->
    <div x-show="state === 'error'" class="error-state" role="status">
      <p>&#9888;&#65039; Les dades del catàleg no estan disponibles. Contacteu l'administrador del sistema.</p>
    </div>

    <!-- Contingut principal -->
    <div x-show="state === 'ready'">
      <!-- Fila de filtres (D-06 ordre: cerca, grado, familia, nivell) -->
      <div class="filter-row">
        <label for="search" class="sr-only">Cerca</label>
        <input type="search" id="search"
          x-model.debounce.250ms="search"
          @input="resetPage()"
          placeholder="Cerca per denominació o codi..."
          autocomplete="off">

        <label for="filter-grado" class="sr-only">Grado</label>
        <select id="filter-grado" x-model="filterGrado" @change="resetPage()">
          <option value="">Tots els grados</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="E">E</option>
        </select>

        <label for="filter-familia" class="sr-only">Família</label>
        <select id="filter-familia" x-model="filterFamilia" @change="resetPage()">
          <option value="">Totes les famílies</option>
          <template x-for="fam in families" :key="fam">
            <option :value="fam" x-text="fam"></option>
          </template>
        </select>

        <label for="filter-nivel" class="sr-only">Nivell</label>
        <select id="filter-nivel" x-model="filterNivel" @change="resetPage()">
          <option value="">Tots els nivells</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>

      <!-- Fila checkbox + comptador (D-06) -->
      <div class="controls-row">
        <label for="hide-old">
          <input type="checkbox" id="hide-old" x-model="hideOld" @change="resetPage()">
          Ocultar pla antic
        </label>
        <span class="counter" x-text="filteredCount === 1 ? '1 resultat' : (filteredCount === 0 ? 'Cap resultat' : filteredCount + ' resultats')"></span>
      </div>

      <!-- Taula (D-07: columnes Denominació | Codi | Família | Grado | Nivell) -->
      <table class="results-table" id="results-table">
        <caption class="sr-only">Resultats del cercador FP Espanya</caption>
        <thead>
          <tr>
            <th scope="col">Denominació</th>
            <th scope="col">Codi</th>
            <th scope="col">Família</th>
            <th scope="col">Grado</th>
            <th scope="col">Nivell</th>
          </tr>
        </thead>
        <tbody>
          <!-- Estat buit dins la taula (D-12) diferenciat de l'error 503 -->
          <template x-if="filteredCount === 0">
            <tr class="empty-row">
              <td colspan="5">Cap resultat coincideix amb els filtres aplicats.</td>
            </tr>
          </template>
          <!-- Files de dades: x-for sobre pagedRecords (max 50 tr al DOM - SRCH-09) -->
          <template x-for="row in pagedRecords" :key="row.id">
            <tr>
              <td>
                <!-- x-text escapa HTML mai x-html (seguretat XSS) -->
                <span x-text="row.denominacion"></span>
                <!-- Badge Pla antic (D-08): inline a Denominació, no columna separada -->
                <span x-show="row.plan_antiguo" class="badge-old">Pla antic</span>
              </td>
              <td x-text="row.codigo ?? '—'"></td>
              <td x-text="row.familia"></td>
              <td x-text="row.grado"></td>
              <td x-text="row.nivel ?? '—'"></td>
            </tr>
          </template>
        </tbody>
      </table>

      <!-- Paginació (D-02) -->
      <nav class="pagination" aria-label="Paginació de resultats" x-show="totalPages > 1">
        <button
          @click="goToPage(currentPage - 1)"
          :aria-disabled="currentPage === 1"
          :class="{ disabled: currentPage === 1 }">Anterior</button>

        <template x-for="item in buildPagination()" :key="JSON.stringify(item)">
          <template x-if="item.type === 'page'">
            <button
              @click="goToPage(item.n)"
              :aria-current="item.n === currentPage ? 'page' : false"
              :aria-label="'Pàgina ' + item.n"
              :class="{ active: item.n === currentPage }"
              x-text="item.n"></button>
          </template>
          <template x-if="item.type === 'ellipsis'">
            <span class="pagination-ellipsis">&#8230;</span>
          </template>
        </template>

        <button
          @click="goToPage(currentPage + 1)"
          :aria-disabled="currentPage === totalPages"
          :class="{ disabled: currentPage === totalPages }">Següent</button>
      </nav>
    </div>
  </div>
</body>
</html>
