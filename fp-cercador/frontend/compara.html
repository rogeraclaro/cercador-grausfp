<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page.title.compare">Comparador de graus — Cercador Graus FP</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display:ital@0;1&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="site.css?v=6">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: var(--fs-body);
      color: var(--dark);
      background: var(--bg);
    }

    [x-cloak] { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 2px solid var(--dark);
      padding: 40px 48px 28px;
    }

    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: var(--fs-display);
      font-weight: 400;
      line-height: 1.05;
      margin-bottom: 10px;
    }

    .hero-sub {
      font-size: var(--fs-lead);
      color: var(--warm);
      max-width: 62ch;
    }

    .content {
      padding: 0 48px 64px;
      min-height: 50vh;
    }

    .btn {
      font-family: inherit;
      font-size: var(--fs-small);
      font-weight: 600;
      color: var(--dark);
      background: var(--white);
      border: 1px solid var(--dark);
      border-radius: 2px;
      padding: 8px 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      white-space: nowrap;
    }

    .btn:hover { background: var(--dark); color: var(--white); }

    .state {
      margin-top: 32px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 28px;
      color: var(--ink-soft);
      line-height: 1.55;
      max-width: 70ch;
    }

    .state p + p { margin-top: 10px; }
    .state .btn { margin-top: 16px; }
    .state.error { border-color: var(--alert-edge); background: var(--alert-bg); color: var(--alert-ink); }

    /* Una fila per tema; una columna per grau */
    .row {
      display: grid;
      grid-template-columns: 170px repeat(var(--cols), minmax(0, 1fr));
      column-gap: 28px;
      border-bottom: 1px solid var(--border);
      padding: 18px 0;
    }

    .row > h2 {
      font-size: var(--fs-label);
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--warm);
      padding-top: 3px;
    }

    .row.head {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      border-bottom: 2px solid var(--dark);
      padding: 18px 0 14px;
    }

    .col-head {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .col-head .title {
      flex: 1;
      min-width: 0;
      font-family: 'DM Serif Display', serif;
      font-size: var(--fs-title);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .col-head .title a { color: var(--dark); text-decoration: none; }
    .col-head .title a:hover { text-decoration: underline; }

    .grade {
      flex-shrink: 0;
      font-family: 'Geist Mono', monospace;
      font-size: var(--fs-label);
      font-weight: 500;
      border: 1px solid var(--dark);
      border-radius: 2px;
      padding: 1px 5px;
    }

    .remove {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      font-size: 14px;
      line-height: 1;
      color: var(--warm);
      background: none;
      border: 1px solid transparent;
      border-radius: 2px;
      cursor: pointer;
    }

    .remove:hover { color: var(--alert-ink); border-color: var(--alert-edge); background: var(--alert-bg); }

    .cell { min-width: 0; line-height: 1.45; overflow-wrap: anywhere; }

    /* A l'ordinador la capçalera ja diu de quin grau és cada columna */
    .cell-label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .cell ul { list-style: none; }
    .cell li { padding: 3px 0; }
    .cell li + li { border-top: 1px dotted var(--border); }
    .cell a { color: var(--dark); }

    .code {
      font-family: 'Geist Mono', monospace;
      font-size: var(--fs-label);
      color: var(--warm);
    }

    .none { color: var(--faded); }

    .common {
      background: var(--path-bg);
      color: var(--path-ink);
      border-radius: 2px;
      padding: 0 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .shared {
      grid-column: 2 / -1;
      background: var(--path-bg);
      border-left: 2px solid var(--path-ink);
      border-radius: 2px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .shared h3,
    .sub {
      font-size: var(--fs-label);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .shared h3 { color: var(--path-ink); }
    .sub { color: var(--warm); }

    .shared ul {
      list-style: none;
      columns: 2;
      column-gap: 28px;
    }

    .shared li { padding: 2px 0; break-inside: avoid; }

    .shared + .spacer { grid-column: 1; }

    .more {
      margin-top: 4px;
      font-family: inherit;
      font-size: var(--fs-small);
      color: var(--dark);
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      padding: 4px 0;
    }

    .basic dt { font-size: var(--fs-label); color: var(--warm); margin-top: 6px; }
    .basic dt:first-child { margin-top: 0; }

    .old {
      font-size: var(--fs-label);
      color: var(--amber-ink);
      background: var(--amber-bg);
      border-radius: 2px;
      padding: 0 5px;
      white-space: nowrap;
    }

    .big {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      line-height: 1;
    }

    .ccaa { grid-column: 2 / -1; max-width: 320px; margin-bottom: 14px; }
    .ccaa + .spacer { grid-column: 1; }

    .ccaa label {
      display: block;
      font-size: var(--fs-label);
      color: var(--warm);
      margin-bottom: 4px;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
    }

    .ccaa select {
      width: 100%;
      font-family: inherit;
      font-size: var(--fs-small);
      color: var(--dark);
      background: var(--white);
      border: 1px solid var(--dark);
      border-radius: 2px;
      padding: 6px 8px;
    }

    select:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--dark);
      outline-offset: 2px;
    }

    /* Mòbil: una targeta per tema amb els graus apilats */
    @media (max-width: 899px) {
      .hero { padding: 24px 16px 20px; }
      .hero h1 { font-size: var(--fs-display-sm); }
      .content { padding: 0 16px 40px; }

      .row {
        display: block;
        padding: 18px 0;
      }

      .row.head { position: static; }
      .row.head > h2 { display: none; }
      .col-head { padding: 6px 0; }
      .row > h2 { margin-bottom: 10px; }

      .cell { padding: 10px 0 10px 12px; border-left: 2px solid var(--border); margin-top: 10px; }

      .cell-label {
        position: static;
        width: auto;
        height: auto;
        clip-path: none;
        white-space: normal;
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .shared ul { columns: 1; }
    }

    @media (pointer: coarse) {
      .remove { width: 44px; height: 44px; }
      .btn, .more { min-height: 44px; }
      .ccaa select { min-height: 44px; font-size: var(--fs-input); }
    }

    @media print {
      .topbar, .site-footer, .fb-tab, .remove, .hero .btn, .more { display: none !important; }
      .row.head { position: static; }
    }
  </style>
  <script src="i18n.js?v=20261130"></script>
  <script src="auth.js?v=20261117b"></script>
  <script>
    const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:5001' : '';
    const REF_RE = /^[A-Za-z0-9_.~-]{1,160}$/;   // el mateix que oferta_ref.REF_RE
    const MAX = 3;
    const FOLD_AT = 8;        // les llistes es pleguen a partir de 8 elements

    function refsFromUrl() {
      const raw = (new URLSearchParams(location.search).get('refs') || '').split(',');
      return [...new Set(raw.map(r => r.trim()).filter(r => REF_RE.test(r)))].slice(0, MAX);
    }

    document.addEventListener('alpine:init', () => {
      Alpine.data('compara', () => ({
        state: 'loading',     // loading | empty | invalid | error | ready
        refs: [],
        data: null,
        ccaa: '',             // '' = tot Espanya
        open: {},             // 'fila:ref' → llista desplegada
        copied: false,

        init() {
          this.refs = refsFromUrl();
          this.load();
        },

        async load() {
          const seq = this._seq = (this._seq || 0) + 1;
          if (this.refs.length < 2) { this.data = null; this.state = 'empty'; return; }
          this.state = 'loading';
          try {
            const res = await fetch(API_BASE + '/api/compara?refs=' + this.refs.map(encodeURIComponent).join(','));
            if (seq !== this._seq) return;
            if (res.status === 400) { this.data = null; this.state = 'invalid'; return; }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (seq !== this._seq) return;
            this.data = data;
            this.state = 'ready';
            if (this.ccaa && !this.ccaaList.includes(this.ccaa)) this.ccaa = '';
          } catch (e) {
            if (seq === this._seq) this.state = 'error';
          }
        },

        remove(ref) {
          this.refs = this.refs.filter(r => r !== ref);
          history.replaceState(null, '', this.refs.length
            ? 'compara.html?refs=' + this.refs.map(encodeURIComponent).join(',') : 'compara.html');
          this.load();
        },

        get graus() { return this.data ? this.data.graus : []; },
        get comuns() { return this.data ? this.data.comuns : { moduls: [], ocupacions: [], seguents: [] }; },

        // Files de llista, en l'ordre del pla; només les que tenen dades en algun grau.
        get rows() {
          const text = v => typeof v === 'string' ? { text: v } : { code: v.codigo, text: v.text || v.nombre || '' };
          const node = common => n => ({ grade: n.grado, text: n.denominacion, href: this.grauUrl(n.ref),
                                         common: common && this.comuns.seguents.includes(n.ref) });
          const defs = [
            { key: 'basic', title: t('cmp.row.basic'), kind: 'basic', show: true },
            { key: 'moduls', title: t('cmp.row.moduls'), items: g => g.moduls_propis.map(text),
              show: this.graus.some(g => g.moduls.length) },
            { key: 'uc', title: t('cmp.row.uc'), items: g => g.uc.map(text) },
            { key: 'ra', title: t('cmp.row.ra'), items: g => g.ra.concat(g.ecp).map(text) },
            { key: 'acces', title: t('cmp.row.acces'), items: g => g.acces.map(text) },
            { key: 'ocupacions', title: t('cmp.row.ocupacions'),
              items: g => g.ocupacions.map(o => ({ text: o, common: this.comuns.ocupacions.includes(o) })) },
            { key: 'centres', title: t('cmp.row.centres'), kind: 'centres',
              show: this.graus.some(g => g.centres.total) },
            { key: 'previs', title: t('cmp.row.previs'), items: g => g.previs.map(node(false)) },
            { key: 'seguents', title: t('cmp.row.seguents'), items: g => g.seguents.map(node(true)) },
          ];
          return defs.filter(d => d.show !== undefined ? d.show : this.graus.some(g => d.items(g).length));
        },

        visible(row, g) {
          const items = row.items(g);
          return this.open[row.key + ':' + g.ref] || items.length <= FOLD_AT ? items : items.slice(0, FOLD_AT);
        },

        hidden(row, g) { return Math.max(0, row.items(g).length - FOLD_AT); },
        toggle(row, g) { const k = row.key + ':' + g.ref; this.open = { ...this.open, [k]: !this.open[k] }; },

        get ccaaList() {
          const all = new Set();
          this.graus.forEach(g => Object.keys(g.centres.per_ccaa).forEach(c => all.add(c)));
          return [...all].sort((a, b) => a.localeCompare(b, 'es'));
        },

        centresOf(g) { return this.ccaa ? (g.centres.per_ccaa[this.ccaa] || 0) : g.centres.total; },

        sharedLabel() {
          const s = this.data.moduls_compartits;
          return t('cmp.moduls.shared', { n: s.n, m: s.de });
        },

        share() {
          const url = location.href;
          if (navigator.share && matchMedia('(pointer: coarse)').matches) {
            navigator.share({ title: document.title, url }).catch(() => {});
            return;
          }
          navigator.clipboard.writeText(url).then(() => {
            this.copied = true;
            setTimeout(() => { this.copied = false; }, 2000);
          }).catch(() => {});
        },

        addMoreUrl() { return 'index.html' + (this.refs.length ? '?compara=' + this.refs.map(encodeURIComponent).join(',') : ''); },
        centresUrl(g) { return 'index.html?ref=' + encodeURIComponent(g.ref); },
        // Pàgina pública del grau (/grau/<ref>; en local, directament a Flask), com a index.html.
        grauUrl(ref) { return (API_BASE ? API_BASE + '/api' : '') + '/grau/' + encodeURIComponent(ref); },
      }));
    });
  </script>
  <script defer src="vendor/alpinejs-3.15.11.min.js"></script>
  <script defer src="https://analytics.masellas.info/script.js" data-exclude-search="true" data-exclude-hash="true" data-website-id="ddb6c664-550b-4e2d-848f-796a676e4036"></script>
</head>

<body x-data="compara">

  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="topbar-logo">GrausFP</a>
      <a class="auth-btn topbar-centres" href="https://centres.grausfp.es/" data-lang-href="https://centres.grausfp.es/" target="_blank" rel="noopener" data-i18n="nav.centres">Centres</a>
      <a class="auth-btn topbar-gap" href="que-em-falta.html" data-i18n="nav.gap">Què em falta?</a>
      <div id="auth-widget"></div>
      <div class="lang-selector" aria-label="Language selector">
        <button class="lang-btn" data-lang="ca" onclick="setLang('ca')">CA</button>
        <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
      </div>
    </div>
  </header>

  <div class="hero">
    <div>
      <h1 data-i18n="cmp.h1">Comparador de graus</h1>
      <p class="hero-sub" data-i18n="cmp.sub">Fins a tres graus de costat, amb el que tenen en comú ressaltat.</p>
    </div>
    <button type="button" class="btn" x-show="state === 'ready'" x-cloak @click="share()"
      x-text="copied ? t('cmp.share.copied') : t('cmp.share')"></button>
    <span class="sr-only" aria-live="polite" x-text="copied ? t('cmp.share.copied') : ''"></span>
  </div>

  <main class="content">

    <div class="state" x-show="state === 'loading' && !data" x-text="t('cmp.loading')"></div>

    <div class="state" x-show="state === 'empty'" x-cloak>
      <p x-text="refs.length ? t('cmp.empty.one') : t('cmp.empty.none')"></p>
      <p x-text="t('cmp.empty.how')"></p>
      <a class="btn" :href="addMoreUrl()" x-text="t('cmp.go_search')"></a>
    </div>

    <div class="state" x-show="state === 'invalid'" x-cloak>
      <p x-text="t('cmp.invalid')"></p>
      <a class="btn" href="index.html" x-text="t('cmp.go_search')"></a>
    </div>

    <div class="state error" role="alert" x-show="state === 'error'" x-cloak>
      <p x-text="t('cmp.error')"></p>
      <button type="button" class="btn" @click="load()" x-text="t('cmp.retry')"></button>
    </div>

    <template x-if="data && (state === 'ready' || state === 'loading')">
      <div :style="'--cols:' + graus.length" :aria-busy="state === 'loading' ? 'true' : 'false'">

        <div class="row head">
          <h2 x-text="t('cmp.row.grau')"></h2>
          <template x-for="g in graus" :key="g.ref">
            <div class="col-head">
              <span class="grade" :title="t('lists.public.grade', {g: g.grado})" x-text="g.grado"></span>
              <span class="title"><a :href="grauUrl(g.ref)" :title="t('grau.page_link')" x-text="g.denominacion"></a></span>
              <button type="button" class="remove" @click="remove(g.ref)"
                :aria-label="t('cmp.remove', {name: g.denominacion})">✕</button>
            </div>
          </template>
        </div>

        <template x-for="row in rows" :key="row.key">
          <section class="row" :aria-label="row.title">
            <h2 x-text="row.title"></h2>

            <template x-if="row.key === 'moduls' && comuns.moduls.length">
              <div class="shared">
                <h3 x-text="sharedLabel()"></h3>
                <ul>
                  <template x-for="m in comuns.moduls" :key="m"><li x-text="m"></li></template>
                </ul>
              </div>
            </template>
            <template x-if="row.key === 'moduls' && comuns.moduls.length">
              <span class="spacer" aria-hidden="true"></span>
            </template>

            <template x-if="row.kind === 'centres' && ccaaList.length">
              <div class="ccaa">
                <label for="ccaa" x-text="t('cmp.centres.ccaa')"></label>
                <select id="ccaa" x-model="ccaa">
                  <option value="" x-text="t('cmp.centres.spain')"></option>
                  <template x-for="c in ccaaList" :key="c"><option :value="c" x-text="c"></option></template>
                </select>
              </div>
            </template>
            <template x-if="row.kind === 'centres' && ccaaList.length">
              <span class="spacer" aria-hidden="true"></span>
            </template>

            <template x-for="g in graus" :key="g.ref">
              <div class="cell">
                <p class="cell-label"><span class="grade" x-text="g.grado"></span><span x-text="g.denominacion"></span></p>

                <template x-if="row.kind === 'basic'">
                  <dl class="basic">
                    <dt x-text="t('cmp.basic.familia')"></dt>
                    <dd x-text="g.familia"></dd>
                    <dt x-show="g.nivel_label" x-text="t('cmp.basic.nivel')"></dt>
                    <dd x-show="g.nivel_label" x-text="g.nivel_label"></dd>
                    <dt x-show="g.codigo" x-text="t('cmp.basic.codi')"></dt>
                    <dd x-show="g.codigo"><span class="code" x-text="g.codigo"></span>
                      <span class="old" x-show="g.plan_antiguo" x-text="t('index.badge.old')"></span></dd>
                    <dt x-show="g.duracion_horas" x-text="t('cmp.basic.durada')"></dt>
                    <dd x-show="g.duracion_horas" x-text="g.duracion_horas + ' h'"></dd>
                  </dl>
                </template>

                <template x-if="row.kind === 'centres'">
                  <div>
                    <p><span class="big" x-text="centresOf(g)"></span>
                      <span x-text="ccaa ? t('cmp.centres.in', {ccaa: ccaa}) : t('cmp.centres.all')"></span></p>
                    <a :href="centresUrl(g)" x-show="g.centres.total" x-text="t('cmp.centres.see')"></a>
                  </div>
                </template>

                <template x-if="!row.kind">
                  <div>
                    <p class="sub" x-show="row.key === 'moduls' && comuns.moduls.length && row.items(g).length"
                      x-text="t('cmp.moduls.own')"></p>
                    <p class="none" x-show="!row.items(g).length">
                      <span :aria-label="t('cmp.nodata')"
                        x-text="row.key === 'moduls' && g.moduls.length ? t('cmp.moduls.all_shared') : '—'"></span>
                    </p>
                    <ul x-show="row.items(g).length">
                      <template x-for="(item, i) in visible(row, g)" :key="i">
                        <li>
                          <span class="grade" x-show="item.grade" x-text="item.grade"></span>
                          <span class="code" x-show="item.code" x-text="item.code"></span>
                          <template x-if="item.href">
                            <a :href="item.href" :class="{ common: item.common }" x-text="item.text"></a>
                          </template>
                          <template x-if="!item.href">
                            <span :class="{ common: item.common }" x-text="item.text"></span>
                          </template>
                          <span class="sr-only" x-show="item.common" x-text="t('cmp.common.sr')"></span>
                        </li>
                      </template>
                    </ul>
                    <button type="button" class="more" x-show="hidden(row, g)" @click="toggle(row, g)"
                      :aria-expanded="open[row.key + ':' + g.ref] ? 'true' : 'false'"
                      x-text="open[row.key + ':' + g.ref] ? t('cmp.less') : t('cmp.more', {n: hidden(row, g)})"></button>
                  </div>
                </template>
              </div>
            </template>

          </section>
        </template>

      </div>
    </template>

  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="footer.js?v=3"></script>
  <script src="feedback.js?v=6"></script>

  <noscript>
    <p>Comparador de graus de Formació Professional. Activa JavaScript per fer-lo servir.</p>
  </noscript>
</body>

</html>
